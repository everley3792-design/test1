<style>
/* OC Shimeji v4 · Cozy Miniature UI

 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

 quality:{fps:60,scale:2.5,shadows:2,particles:1,ambient:2,cloudShadow:1,maxChars:12,bgTick:1},

  const pers=d=>{const sl=(d&&d.pers&&d.pers.sl)||{};return{sliders:Object.fromEntries(C.SLIDERS.map(s=>[s.k,Number.isFinite(+sl[s.k])?+sl[s.k]:50])),traits:((d&&d.pers&&d.pers.traits)||[]).filter(t=>C.TRAIT[t]).slice(0,6)}};

(function(OC){'use strict';

const DEMO_QUIRKS={mochi:{walk:'bouncy',happy:'spin',greet:'wave',sleep:'talk'},yuzu:{walk:'tiptoe',happy:'dance',greet:'bow',eat:'slow'},sora:{walk:'shuffle',happy:'blush',greet:'nod',sleep:'curl',volume:'soft'}};

 /* 依角色 ID 與特質產生固定的口味偏好（玩家可在編輯器修改） */

 /* =========== 每格更新動畫通道 =========== */
 anim(a,dt){const A=a.an||(a.an={t:Math.random()*10,br:Math.random()*6,step:0,blinkT:U.rnd(1,4),blink:0,flip:{x:a.facing||1,v:0},sq:{x:1,v:0},hy:{x:0,v:0},hx:{x:0,v:0},ht:{x:0,v:0},tl:{x:0,v:0},lean:{x:0,v:0},look:0,lookT:2,talkT:0});

  A.br+=dt*(sleeping?1.05:a.sick?2.2:1.7);

  U.spring(A.flip,a.facing||1,dt,260,.82);
  /* 擠壓伸展：外部觸發 a.squash(v) */
  U.spring(A.sq,1,dt,200,.38);

  A.lookT-=dt;if(A.lookT<=0){A.lookT=U.rnd(1.8,4.5);A.look=a.lookAt!=null?a.lookAt:(Math.random()<.55?0:U.rnd(-1,1))}
  if(a.lookAt!=null)A.look=a.lookAt;
  /* 頭部目標偏移 */
  let hyT=0,htT=A.look*5,hxT=A.look*4,leanT=0,tailAmp=10,tailSpd=1.6,tailBase=0;
  const bob=moving?Math.abs(Math.sin(A.step)):0;
  if(moving){leanT=(st==='run'?5:2)*Math.sign(a.vx||0)*(a.facing||1);hyT=bob*(Q.walk==='bouncy'?6:3);if(Q.walk==='strut')htT-=2;if(Q.walk==='sway')htT+=Math.sin(A.step*.5)*6;tailSpd=2.6;tailAmp=st==='run'?16:12}
  switch(st){
   case'sit':hyT+=8;tailAmp=6;tailSpd=1;break;
   case'sleep':hyT+=14;htT=(Q.sleep==='starfish'?-10:12)+Math.sin(A.br*.5)*1.5;tailAmp=3;tailSpd=.5;tailBase=Q.sleep==='curl'?20:8;break;
   case'eat':hyT+=4+Math.max(0,Math.sin(A.t*(Q.eat==='fast'?14:Q.eat==='slow'?5:9)))*5;tailAmp=12;tailSpd=2.4;break;
   case'pet':htT=(a.petDir||1)*9+Math.sin(A.t*3)*3;hyT=2+(a.petY||0)*4;tailAmp=22;tailSpd=4.2;leanT=(a.petDir||1)*3;break;
   case'held':hyT=-4;tailAmp=20;tailSpd=3;htT=Math.sin(A.t*5)*5;break;
   case'sad':hyT+=6;htT+=8;tailAmp=4;tailSpd=.7;tailBase=-18;break;
   case'angry':htT=Math.sin(A.t*18)*2;tailAmp=18;tailSpd=5;tailBase=-6;break;
   case'cheer':hyT=-4;tailAmp=24;tailSpd=5;break;
   case'talk':hyT+=Math.max(0,Math.sin(A.t*7))*2;tailAmp=12;tailSpd=2;break;
   case'look':htT=a.lookAt!=null?a.lookAt*10:Math.sin(A.t*.8)*10;break;
   case'stretch':hyT=-6;htT=-6;tailBase=20;tailAmp=4;break}

 face(a,A){if(a.faceOverride)return a.faceOverride;const st=a.pose;if(st==='sleep')return'sleep';

 /* =========== 繪製 =========== */
 draw(ctx,a,sx,sy,s,dt){const r=this.get(a.c);const A=this.anim(a,dt);const scale=(a.c.scale||1)*(a.sizeK||1);

  const hx=A.hx.x*k,hy=(A.hy.x+Math.sin(A.br)*(a.pose==='sleep'?2.2:1.1))*k+bodyDy*.6;
  ctx.save();const pvx=(P.head[0]-CX)*k,pvy=(P.head[1]-FOOT_Y)*k;ctx.translate(pvx+hx,pvy+hy);ctx.rotate(A.ht.x*Math.PI/180);ctx.translate(-pvx,-pvy);img(H,0,0);

 decay(c,H,a){const sick=c.health.sick&&C.SICK[c.health.sick];for(const [k,r] of Object.entries(C.DECAY)){let rate=r*Chars.needW(c,k);if(sick&&sick.fx[k])rate*=sick.fx[k];

   /* 會照顧人的朋友會過來關心 */const helper=[...this.agents.values()].find(o=>o!==a&&o.loc===a.loc&&!o.busy()&&Chars.soc(o.c,'comfort')>1.2&&Math.hypot(o.x-a.x,o.z-a.z)<8);if(helper&&OC.Social)setTimeout(()=>{if(!helper.busy()&&!a.busy())OC.Social.start(helper,a,'comfort')},1500);setTimeout(()=>a.face=null,1600);return}

 result(a,T){const c=a.c,d=T.def;const lucky=Chars.has(c,'lucky')?1.6:1;
  if(d.loot&&Math.random()<.75*lucky){const sk=(c.skills[d.skill]||0);const pool=d.loot;let id=pool[Math.min(pool.length-1,Math.floor(Math.random()*(pool.length-1+Math.min(1,sk/60)+(lucky>1?.6:0))))];
   if(id){Items.add(id,1);const it=C.ITEM[id];this.log(c,`${c.name}在${C.LOC[c.loc].t}${d.t==='釣魚'?'釣到了':'找到了'}${it.em}${it.name}`,it.rare?'star':'leaf');
    if(this.visible(a)){a.say(it.rare?`哇！是${it.name}！`:`找到${it.name}了～`);a.feel(it.rare?'spark':'note');OC.Fx.sparkle(a.x,1.2,a.z,it.rare?10:5)}
    if(it.rare)this.remember(c,'find',`找到稀有的${it.name}`,.8,[],c.loc);OC.Quests&&OC.Quests.on('loot:'+it.cat,c)}}
  if(d.id==='garden'){const G=OC.S.world.garden;const k=T.obj&&T.obj.plot;if(k!=null){const p=G[k]||(G[k]={g:0});p.g=Math.min(4,(p.g||0)+1);p.t=Date.now();if(p.g>=4&&Math.random()<.35){Items.add('flower',1);p.g=1;this.log(c,`${c.name}的花圃開花了，收成了野花`,'leaf')}OC.R.invalidate()}}
  if(d.id==='cook'&&Math.random()<.1+c.skills.cooking/400){const f=U.pick(['onigiri','soup','bread','cookie']);Items.add(f,1);this.log(c,`${c.name}做了${C.ITEM[f].em}${C.ITEM[f].name}，放進了背包`,'heart')}
  if(['stargaze','sunset'].includes(d.id)&&Math.random()<.5){const others=[...this.agents.values()].filter(o=>o!==a&&o.task&&o.task.def.id===d.id);this.remember(c,'view',d.id==='stargaze'?'看到滿天星星':'看了很美的夕陽',.6,others.map(o=>o.id),c.loc);for(const o of others){OC.Social&&OC.Social.bond(a,o,4,'一起'+d.t)}}
  if(Math.random()<.2)this.remember(c,'act',d.t,.25,[],c.loc)},
 /* ================= 旅行 ================= */
 travel(a,loc){const T=a.task,c=a.c;T.phase='leave';a.fromLoc=c.loc;
  const from=c.loc;const e=from==='house'?scene('house').spots.door:(loc==='house'?scene('home').spots.door:EXIT[from]);a.goal={x:e.x,z:e.z};
  if(from==='home'&&loc==='house'||from==='house'&&loc==='home'){T.door=1}
  if(this.visible(a)&&Math.random()<.4)a.say(Chars.say(c,U.pick([`我去${C.LOC[loc].t}一下～`,`出發去${C.LOC[loc].t}！`,'我先走囉。'])))},
 sendTo(a,loc){/* 玩家指示：帶夥伴去某地 */const T={def:{id:'go',t:'前往',gain:{},dur:[3,6],pose:'stand',loc:[loc]},loc,t:0,dur:4,phase:'go'};a.task=T;if(loc!==a.c.loc)this.travel(a,loc);else this.target(a,T)},
 /* ================= 移動（避障、互相讓路） ================= */
 move(a,dt){const sc=scene(a.loc);if(a.held||a.away)return;
  if(!a.goal){a.vx=U.approach(a.vx,0,10,dt);a.vz=U.approach(a.vz,0,10,dt);if(Math.abs(a.vx)<.02&&(a.pose==='walk'||a.pose==='run'))a.pose=a.task&&a.task.phase==='do'?a.pose:'stand';return}
  const c=a.c;const dx=a.goal.x-a.x,dz=a.goal.z-a.z,dist=Math.hypot(dx,dz);
  if(dist<.12){a.goal=null;a.stuck=0;return}
  const W=c.quirks.walk;let sp=(.75+Chars.sl(c,'pace')*.55)*(W==='shuffle'?.78:W==='tiptoe'?1.05:W==='bouncy'?1.05:1)*(a.goal.fast?2.3:1)*(c.health.sick?.65:1)*(Chars.has(c,'athletic')?1.12:1);
  sp=Math.min(sp,dist*3+.3);let ang=Math.atan2(dz,dx);let ok=false,nx=a.x,nz=a.z;
  const tries=[0,.45,-.45,.9,-.9,1.35,-1.35,1.8,-1.8];if(a.avoid)tries.sort((p,q)=>Math.abs(p-a.avoid*.45)-Math.abs(q-a.avoid*.45));
  for(const off of tries){const an=ang+off;const px=a.x+Math.cos(an)*sp*dt,pz=a.z+Math.sin(an)*sp*dt;if(sc.ok(px,pz,a.task&&a.task.obj)||dist<.9&&sc.walk(px,pz)){nx=px;nz=pz;ok=true;if(off)a.avoid=Math.sign(off);break}}
  /* 和其他角色保持距離；絕交中的人會互相迴避 */
  for(const o of this.agents.values()){if(o===a||o.loc!==a.loc||o.away)continue;const ex=nx-o.x,ez=nz-o.z,d2=ex*ex+ez*ez;if(OC.Social&&d2<5&&d2>1e-4&&OC.Social.rel(c.id,o.id).broken){const d=Math.sqrt(d2);nx+=ex/d*sp*dt*.6;nz+=ez/d*sp*dt*.6;continue}if(d2<.28&&d2>1e-4){const d=Math.sqrt(d2);nx+=ex/d*(.53-d)*.25;nz+=ez/d*(.53-d)*.25}}
  if(!ok||!sc.walk(nx,nz)){a.stuck+=dt;if(a.stuck>1.4){a.goal=null;a.stuck=0}return}
  a.stuck=Math.max(0,a.stuck-dt);const vx=(nx-a.x)/dt,vz=(nz-a.z)/dt;a.vx=U.approach(a.vx,vx,12,dt);a.vz=U.approach(a.vz,vz,12,dt);a.x=nx;a.z=nz;
  if(Math.abs(a.vx)>.08)a.facing=a.vx>0?1:-1;if(a.pose!=='walk'&&a.pose!=='run')a.pose=a.goal.fast?'run':'walk';
  if(a.pose==='run'&&Math.random()<dt*3&&this.visible(a))OC.Fx.dust(a.x,a.z,1)},
 visible(a){return OC.R.sc&&OC.R.sc.id===a.loc&&!a.away},

 /* ================= 健康與生病 ================= */
 health(a,dt){const c=a.c,H=c.health,now=Date.now();
  if(H.sick){if(now>=H.until){this.recover(a,'自然痊癒');return}
   if(Math.random()<dt*.025&&this.visible(a)){const s=H.sick;if(s==='cold'){a.say(U.pick(C.LINES.sick.cold),{life:2});a.squash(.8);a.feel('sweat')}else{a.say(U.pick(C.LINES.sick[s]),{life:2.6,tone:'sad'});a.feel('sick',2)}}
   if(H.sick==='tired'&&a.task&&a.task.def.id==='sleep')H.until-=dt*1000*3;return}
  if(now<H.immune)return;const n=c.needs;let risk=0;
  let base=.03;risk+=base;if(n.hygiene<20)risk+=.6;if(n.energy<12)risk+=.8;if(Env.rainy()&&c.loc!=='house'&&!a.inside)risk+=.35;if(n.hunger<8)risk+=.4;if(c.emo.sad>.7)risk+=.5;
  if(!risk)return;if(Math.random()<risk*dt/1800){const k=n.energy<12?'tired':c.emo.sad>.7?'blue':n.hunger<8?'tummy':'cold';this.getSick(a,k)}},
 getSick(a,k){const c=a.c,S=C.SICK[k];if(c.health.sick||!S)return;if(!OC.S.settings.negEvents){return}
  c.health.sick=k;c.health.since=Date.now();c.health.until=Date.now()+S.dur*3600e3*U.rnd(.7,1.2);
  this.remember(c,'sick',`生病了（${S.t}）`,-.6,[],c.loc);this.log(c,`${c.name}${k==='blue'?'心情低落':'生病了'}：${S.t}。${S.d}`,'sick');
  OC.UI&&OC.UI.toast(`${c.name} ${S.t}了…`,'sick');this.moodOf(c);
  if(a.task&&!['sleep','nap','rest','sofa'].includes(a.task.def.id))this.finish(a,false);U.emit('sick',c)},
 heal(a,power,by){const c=a.c,H=c.health;if(!H.sick)return false;H.until-=power*3600e3*.6;if(Date.now()>=H.until||power>=2){this.recover(a,by);return true}a.feel('heart');a.say(by?'謝謝你照顧我…':'感覺好一點了…');return true},
 recover(a,by){const c=a.c,k=c.health.sick;if(!k)return;c.health.sick=null;c.health.immune=Date.now()+2*3600e3;c.needs.comfort=Math.min(100,c.needs.comfort+20);
  this.log(c,`${c.name}的${C.SICK[k].t}好了！${by?'（'+by+'）':''}`,'heart');this.remember(c,'recover','身體恢復了',.5,[],c.loc);
  if(this.visible(a)){a.say('我好了！完全恢復精神～');a.hop(2);OC.Fx.sparkle(a.x,1,a.z,8)}this.moodOf(c);U.emit('sick',c)},

 /* ================= 記憶、日誌、技能 ================= */
 remember(c,k,text,val,withIds=[],loc){c.memories.unshift({t:Date.now(),k,text,val,with:withIds,loc:loc||c.loc});
  if(c.memories.length>80){/* 保留重要（強烈情緒）的記憶 */c.memories.sort((a,b)=>Math.abs(b.val)*1e13+b.t-(Math.abs(a.val)*1e13+a.t));c.memories.length=70;c.memories.sort((a,b)=>b.t-a.t)}},
 log(c,text,ic='leaf'){OC.S.log.unshift({t:Date.now(),id:c&&c.id,text,ic});if(OC.S.log.length>240)OC.S.log.length=240;U.emit('log')},
 skill(c,k,n){const before=Math.floor((c.skills[k]||0)/20);c.skills[k]=Math.min(100,(c.skills[k]||0)+n*(Chars.has(c,'smart')?1.4:1));const after=Math.floor(c.skills[k]/20);
  if(after>before){const N={cooking:'料理',gardening:'園藝',fishing:'釣魚',reading:'閱讀',social:'社交',explore:'探索',fitness:'運動',creativity:'創意'};this.log(c,`${c.name}的${N[k]}技能升到 Lv.${after}！`,'star');OC.UI&&OC.UI.celebrate&&OC.UI.celebrate(c,`${N[k]}技能 Lv.${after}`,'技能升級');}},
 heard(a,text){/* 角色說話時，附近的人會注意 */},
 /* ================= 願望 ================= */
 wish(a){const c=a.c;c.wishes=c.wishes.filter(w=>Date.now()-w.t<40*60e3);if(c.wishes.length>=2||Math.random()<.5)return;
  const opts=[];const fav=Object.entries(c.foodPref).filter(([,v])=>v===2).map(([k])=>k);
  const foods=C.ITEMS.filter(i=>(i.cat==='food'||i.cat==='drink')&&i.tags.some(t=>fav.includes(t)));if(foods.length)opts.push({k:'eat',item:U.pick(foods).id,w:c.needs.hunger<60?2:1});
  const acts=['fish','stargaze','read','garden','cafe','explore','shells','music','campfire','picnic'].filter(x=>Chars.aiW(c,x)>1.1||Math.random()<.2);if(acts.length)opts.push({k:'do',act:U.pick(acts),w:1});
  const others=[...this.agents.values()].filter(o=>o!==a);if(others.length&&c.needs.social<70){const o=U.pick(others);const r=OC.Social&&OC.Social.rel(c.id,o.id);if(!r||!r.broken)opts.push({k:'talk',with:o.id,w:1})}
  opts.push({k:'pet',w:Chars.has(c,'clingy')?2:.6});
  const g=U.weighted(opts);if(!g)return;g.t=Date.now();g.id=U.uid('w');delete g.w;c.wishes.push(g);U.emit('wish',c)},
 wishText(c,w){if(w.k==='eat'){const it=C.ITEM[w.item];return`想吃${it.em}${it.name}`}if(w.k==='do')return`想${Acts.ACT[w.act]?.t||'玩'}`;if(w.k==='talk'){const o=OC.S.chars.find(x=>x.id===w.with);return`想跟${o?o.name:'朋友'}聊天`}if(w.k==='pet')return'想被摸摸頭';return'…'},
 fulfill(a,w){const c=a.c;c.wishes=c.wishes.filter(x=>x!==w);c.emo.joy=Math.min(1,c.emo.joy+.4);Items.coins(25);c.bond+=6;
  this.log(c,`${c.name}的願望實現了：${this.wishText(c,w)}（+25 星幣）`,'star');if(this.visible(a)){a.feel('spark',2);a.hop(2.2);OC.Fx.sparkle(a.x,1.1,a.z,10)}
  OC.UI&&OC.UI.toast(`${c.name}的願望實現了！+25 星幣`,'star');OC.Quests&&OC.Quests.on('wish',c);U.emit('wish',c)},
 checkWish(a,k,data){for(const w of [...a.c.wishes]){if(w.k===k&&(k!=='eat'||w.item===data)&&(k!=='talk'||w.with===data))this.fulfill(a,w)}},

 /* ================= 後天特質成長（需玩家同意） ================= */
 GROW:[['read',22,'bookworm','經常看書'],['garden',18,'nature','經常照顧花草'],['_night',30,'nightowl','常在夜晚活動'],['fish',18,'sealover','常去海邊釣魚'],['cook',14,'cook','常常下廚'],['explore',18,'curious','熱愛森林探險'],['tidy',16,'tidy','總是在打掃'],['stargaze',12,'stargazer','常常看星星'],['music',16,'music','常聽音樂'],['play',22,'athletic','常常跑跳玩耍'],['_chat',40,'extrovert','和大家聊了很多天'],['_comfort',8,'caring','常常安慰朋友'],['sofa',22,'lazy','老是窩在沙發'],['shells',18,'collector','熱衷撿貝殼']],
 growth(c){if(c.noSuggest||c.lockedTraits.includes('*')||c.traits.length>=8)return;if(OC.S.pending.some(p=>p.k==='trait'&&p.cid===c.id))return;
  for(const [k,n,t,why] of this.GROW){if((c.counters[k]||0)<n||c.traits.includes(t))continue;const dec=c.declined[t]||0;if(dec>Date.now())continue;if(c.traits.some(x=>C.EXCL(x,t)&&c.lockedTraits.includes(x)))continue;
   OC.S.pending.push({id:U.uid('p'),k:'trait',cid:c.id,trait:t,why,t:Date.now()});this.log(c,`${c.name}因為「${why}」，好像漸漸變得${C.TRAIT[t].t}了…`,'idea');U.emit('pending');return}},
 /* ================= 離線生活 ================= */
 offline(sec){if(sec<60)return null;const H=Math.min(sec/3600,48);const out=[];
  for(const c of OC.S.chars){if(c.onIsland===false)continue;
   for(const [k,r] of Object.entries(C.DECAY)){const floor=k==='energy'?45:35;c.needs[k]=Math.max(Math.min(c.needs[k],floor),c.needs[k]-r*H*.6)}
   /* 自己照顧自己：睡覺、吃飯（不懲罰長時間離線） */
   if(H>2){c.needs.energy=Math.max(c.needs.energy,70);c.needs.hunger=Math.max(c.needs.hunger,50)}
   if(c.health.sick&&Date.now()>c.health.until){c.health.sick=null;c.health.immune=Date.now()+3600e3}
   const n=Math.min(4,Math.floor(H*1.2));for(let i=0;i<n;i++){const opts=Acts.ACTS.filter(d=>d.loot||['read','garden','stargaze','cook','cafe'].includes(d.id));const d=U.weighted(opts.map(x=>({d:x,w:Chars.aiW(c,x.id)})))?.d;if(!d)continue;
    c.counters[d.id]=(c.counters[d.id]||0)+1;if(d.skill)this.skill(c,d.skill,1);let txt=`${c.name}${d.t}`;if(d.loot&&Math.random()<.6){const id=U.pick(d.loot);Items.add(id,1);txt+=`，帶回了${C.ITEM[id].em}${C.ITEM[id].name}`}out.push(txt)}}
  for(const t of out)this.log(null,'你不在的時候：'+t,'moon');
  if(OC.Social)OC.Social.offline(H);return{hours:H,lines:out}}};
Sim.EXIT=EXIT;Sim.Agent=Agent;
OC.Sim=Sim;
})(window.OC);

</script>
<script data-src="sim/social.js">
/* OC Shimeji v4 · 多角色社交：聊天、玩耍、安慰、送禮、吵架、道歉、絕交、和好、告白 */
(function(OC){'use strict';
const {U,Content:C,Chars,Env}=OC;
const key=(a,b)=>a<b?a+'|'+b:b+'|'+a;
const LBL={stranger:'陌生',acq:'認識',friend:'朋友',good:'好友',best:'摯友',bad:'不合',broken:'絕交',lovers:'戀人',family:'家人',rival:'競爭對手'};
const Social={LBL,
 rel(a,b){const k=key(a,b);let r=OC.S.rel[k];if(!r){r=OC.S.rel[k]={f:0,r:0,trust:20,conf:0,fam:0,mem:[],last:0,broken:false,lovers:false,tag:null,noRomance:false,greet:''}}return r},
 status(r){if(r.broken)return'broken';if(r.lovers)return'lovers';if(r.tag)return r.tag;if(r.f<=-30)return'bad';if(r.f>=70)return'best';if(r.f>=40)return'good';if(r.f>=15)return'friend';return r.fam>=3?'acq':'stranger'},
 label(r){return LBL[this.status(r)]},
 change(a,b,df,o={}){const r=this.rel(a.c?a.c.id:a,b.c?b.c.id:b);const before=this.status(r);if(df>0)df*=U.clamp(1-Math.max(0,r.f)/125,.12,1)*.55;r.f=U.clamp(r.f+df,-100,100);if(o.conf)r.conf=U.clamp(r.conf+o.conf,0,100);if(o.trust)r.trust=U.clamp(r.trust+o.trust,0,100);if(o.r)r.r=U.clamp(r.r+o.r,0,100);r.fam++;r.last=Date.now();
  const after=this.status(r);if(after!==before&&!['acq','stranger'].includes(after)){const A=nameOf(a),B=nameOf(b);if(['friend','good','best'].includes(after)&&rank(after)>rank(before)){OC.Sim.log(null,`${A}和${B}的關係變成了「${LBL[after]}」！`,'heart');OC.UI&&OC.UI.toast(`${A} ♥ ${B}：${LBL[after]}`,'heart');addMem(r,`成為${LBL[after]}`,.8)}else if(after==='bad'){OC.Sim.log(null,`${A}和${B}的關係變差了…`,'cloud')}}
  U.emit('rel');return r},
 bond(a,b,n,why){const r=this.change(a,b,n,{trust:n*.5});if(why)addMem(r,why,.5)},
 offline(H){for(const r of Object.values(OC.S.rel)){if(r.broken)continue;r.conf=Math.max(0,r.conf-H*10);if(r.f>10)r.f=Math.min(100,r.f+Math.min(4,H*.6))}},

 /* ============ 是否要找人互動 ============ */
 maybe(a){if(OC.S.settings.autoSocial===false)return;const c=a.c;if(a.task&&(a.task.def.ex||a.task.def.pose==='sleep'))return;if(a.inside||a.away)return;
  const near=[...OC.Sim.agents.values()].filter(o=>o!==a&&o.loc===a.loc&&!o.away&&!o.busy()&&OC.Sim.casual(o)&&!(o.task&&o.task.def.pose==='sleep')&&!((a.avoid_||{})[o.id]>Date.now())&&Math.hypot(o.x-a.x,o.z-a.z)<(a.loc==='house'?9:7.5));
  if(!near.length)return;
  const want=(1-c.needs.social/100)*.75+Chars.sl(c,'social')*.35+(Chars.has(c,'chatty')?.2:0)-(Chars.has(c,'loner')?.25:0)+(c.emo.anger>.4?.25:0);
  if(Math.random()>want)return;
  /* 選對象：偏好喜歡的人；生氣時可能找麻煩 */
  const tgt=U.weighted(near.map(o=>{const r=this.rel(c.id,o.id);let w=1+Math.max(0,r.f)/40;if(r.broken)w=Chars.soc(c,'forgive')>1.2&&Date.now()-r.brokenAt>20*60e3?.6:.05;if(o.c.health.sick||o.mood==='sad')w+=Chars.soc(c,'comfort')*1.2;if(c.wishes.some(x=>x.k==='talk'&&x.with===o.id))w+=3;return{o,w}}));
  if(tgt)this.start(a,tgt.o)},
 /* ============ 互動類型挑選 ============ */
 choose(a,b){const c=a.c,d=b.c,r=this.rel(c.id,d.id),neg=OC.S.settings.negEvents!==false;const grumpy=(x)=>(x.needs.hunger<22||x.needs.energy<18?1.8:1)*(1+x.emo.anger*2.5);
  const shared=c.traits.filter(t=>d.traits.includes(t)&&['int'].includes(C.TRAIT[t]?.c)).length+(c.profile.interests||[]).filter(x=>(d.profile.interests||[]).includes(x)).length;
  const W=[];const add=(k,w)=>{if(w>0)W.push({k,w})};
  if(r.broken){add('cold',3);add('reconcile',Chars.soc(c,'forgive')*(Date.now()-(r.brokenAt||0)>20*60e3?.8:.05));return U.weighted(W).k}
  const today=U.dayKey();add('greet',r.greet!==today?4:0);
  add('chat',1.4);add('joke',.5+Chars.sl(c,'lively')*.6-(Chars.has(c,'serious')?.4:0));add('compliment',.3+Chars.sl(c,'friendly')*.6);
  add('share',shared?.8+shared*.5:0);add('play',(c.needs.fun<60&&d.needs.fun<70?.9:.2)*(.4+Chars.sl(c,'lively')));
  add('comfort',(d.health.sick||d.mood==='sad'||d.emo.sad>.4)?2.2*Chars.soc(c,'comfort'):0);
  add('gift',r.f>25&&Math.random()<.3?.5:0);
  add('apology',r.conf>35?1.6*Chars.soc(c,'forgive'):0);
  if(neg){const base=.1*Chars.soc(c,'argue')*grumpy(c)*(r.f<0?2.2:r.f>60?.4:1)*(r.conf>30?1.8:1)*(Chars.has(c,'jealous')&&d.bond>c.bond+20?2:1);add('argue',base);add('tease',Chars.has(c,'prank')||Chars.has(c,'sharp')?.4:0)}
  if(OC.S.settings.romance!==false&&!r.noRomance&&!r.lovers&&r.f>55&&!c.noRomance&&!d.noRomance)add('flirt',.25*(Chars.has(c,'romantic')?2.5:1));
  if(r.lovers)add('date',.9);
  return(U.weighted(W)||{k:'chat'}).k},
 /* ============ 開始互動：走近、面對面、輪流說話 ============ */

 sheet(html,{cls='',onClose,full}={}){const L=$('#layer');const scrim=U.el('<div class="scrim"></div>'),sh=U.el(`<section class="sheet ${cls} ${full?'full':''}" role="dialog"><div class="grab"></div><button class="sh-x" aria-label="關閉">${ic('close')}</button><div class="sh-b">${html}</div></section>`);

   const s=this.sheet(`<div class="dec"><div class="pair"><span class="hav lg">${OC.Rig.avatarHTML(A)}</span><span class="vs">⚡</span><span class="hav lg">${OC.Rig.avatarHTML(B)}</span></div><h2>${esc(A.name)}和${esc(B.name)}鬧翻了</h2><p class="lead">兩人吵得很兇，${esc(A.name)}說：「我們絕交吧！」這會讓兩人互相迴避、不再一起玩。</p>
    <div class="col"><button class="btn primary" data-v="mediate">介入調解</button><button class="btn" data-v="cool">讓他們先冷靜一下</button><button class="btn ghost danger-t" data-v="ok">讓絕交發生</button></div></div>`,{cls:'dialog'});OC.Rig.fillImgs(s.el);
   s.el.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;const v=b.dataset.v;s.close();
    if(v==='ok')OC.Social.breakUp(A.id,B.id);else if(v==='cool'){const r=OC.Social.rel(A.id,B.id);r.conf=Math.max(0,r.conf-30);Sim.log(null,`${A.name}和${B.name}各自冷靜了一下。`,'cloud')}else{const r=OC.Social.mediate(A.id,B.id);this.toast(r.ok?'調解成功！兩人和好了':'兩人還需要一點時間…',r.ok?'heart':'info')}done()});return}
  if(p.k==='lovers'){const A=byId(p.a),B=byId(p.b);if(!A||!B){done();return}
   const s=this.sheet(`<div class="dec"><div class="pair"><span class="hav lg">${OC.Rig.avatarHTML(A)}</span><span class="vs">💗</span><span class="hav lg">${OC.Rig.avatarHTML(B)}</span></div><h2>${esc(A.name)}想向${esc(B.name)}告白</h2><p class="lead">兩人感情越來越好。要讓他們成為戀人嗎？</p>
    <div class="col"><button class="btn primary" data-v="ok">成為戀人</button><button class="btn" data-v="friend">維持好朋友</button><button class="btn ghost" data-v="never">不允許這兩位發展戀愛</button></div></div>`,{cls:'dialog'});OC.Rig.fillImgs(s.el);
   s.el.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;const v=b.dataset.v;s.close();const r=OC.Social.rel(A.id,B.id);
    if(v==='ok'){r.lovers=true;Sim.log(null,`${A.name}和${B.name}成為了戀人！`,'heart');for(const [x,y] of [[A,B],[B,A]])Sim.remember(x,'lovers',`和${y.name}成為戀人`,1,[y.id]);this.celebrate(A,`${A.name} 💗 ${B.name}`,'成為戀人')}else{r.r=Math.min(r.r,40);if(v==='never')r.noRomance=true}done()});return}
  done()},
 frame(){}};

/* ================= 快捷背包：可拖曳位置、展開收合、拖物品給角色 ================= */
UI.bag={init(){const el=$('#qbag');el.innerHTML=`<button class="qb-h" id="qbH" aria-label="背包">${ic('bag',22)}<b id="qbN"></b></button><div class="qb-p" id="qbP"><div class="qb-tabs" id="qbT"></div><div class="qb-l" id="qbL"></div></div>`;
  const st=OC.S.ui||(OC.S.ui={bagY:.62,bagOpen:false,bagTab:'food'});this.st=st;this.apply();
  /* 拖曳把手：上下移動位置；點一下展開 */
  const h=$('#qbH');let d=null;h.addEventListener('pointerdown',e=>{d={y:e.clientY,y0:st.bagY,m:0};h.setPointerCapture(e.pointerId)});
  h.addEventListener('pointermove',e=>{if(!d)return;const dy=e.clientY-d.y;d.m=Math.max(d.m,Math.abs(dy));if(d.m>6){st.bagY=U.clamp(d.y0+dy/innerHeight,.18,.82);this.apply()}});
  h.addEventListener('pointerup',()=>{if(d&&d.m<=6){st.bagOpen=!st.bagOpen;this.apply();U.buzz(6)}d=null;OC.Store.save()});
  $('#qbT').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;st.bagTab=b.dataset.t;this.render()};
  $('#qbL').addEventListener('pointerdown',e=>this.dragStart(e));this.render()},
 apply(){const el=$('#qbag');el.style.top=(this.st.bagY*100)+'%';U.toggle(el,'open',this.st.bagOpen)},
 open(v){this.st.bagOpen=v;this.apply()},
 TABS:[['food','食物',['food','drink']],['care','照顧',['medicine','care','toy']],['gift','禮物',['gift','col','fish','bug']]],
 render(){const tabs=this.TABS.map(([k,t])=>`<button data-t="${k}" class="${this.st.bagTab===k?'on':''}">${t}</button>`).join('');U.setHTML($('#qbT'),tabs);
  const T=this.TABS.find(t=>t[0]===this.st.bagTab)||this.TABS[0];const list=Items.list().filter(i=>T[2].includes(i.cat));
  U.setHTML($('#qbL'),list.length?list.map(i=>`<button class="qi" data-id="${i.id}" title="${esc(i.name)}"><span>${i.em}</span><b>${i.q}</b></button>`).join(''):'<p class="qb-e">空空的<br><small>去商店逛逛吧</small></p>');
  U.setText($('#qbN'),Object.values(OC.S.inv).reduce((a,b)=>a+b,0)||'')},
 /* 拖物品到角色身上 */
 dragStart(e){const b=e.target.closest('.qi');if(!b)return;e.preventDefault();const id=b.dataset.id,it=C.ITEM[id];const g=$('#dghost');g.textContent=it.em;g.style.transform=`translate(${e.clientX-24}px,${e.clientY-40}px) scale(1.15)`;g.classList.add('on');let over=null,moved=false;const sx=e.clientX,sy=e.clientY;
  const mv=ev=>{if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>6)moved=true;g.style.transform=`translate(${ev.clientX-24}px,${ev.clientY-40}px) scale(1.15)`;const r=$('#world').getBoundingClientRect();const a=OC.Input.hitActor(ev.clientX-r.left,ev.clientY-r.top);if(over&&over!==a){over.focus=false}over=a;if(a){a.focus=true;a.nameT=1}U.toggle(g,'hot',!!a)};
  const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);g.classList.remove('on','hot');
   if(over){over.focus=false;if(OC.Play.give(over,id)){U.buzz(12)}}else if(!moved){const a=Sim.active();if(a&&a.loc===OC.R.sc.id){if(OC.Play.give(a,id))U.buzz(12)}else UI.toast(`${it.em}${it.name}：拖到夥伴身上就能使用`,'info')}};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)}};
OC.UI=UI;
})(window.OC);

<script data-src="ui/pages.js">
/* OC Shimeji v4 · 頁面：角色（卡片、檔案、編輯器）、地圖、小島日常（任務、商店、圖鑑、故事、家具）、設定 */
(function(OC){'use strict';
const {U,Content:C,Chars,Items,Sim,Env,UI}=OC;const {$,esc}=U;const ic=UI.ic;
const NAV=[['world','小島','home'],['chars','角色','users'],['map','地圖','map'],['life','日常','life'],['more','設定','gear']];
const Pages={cur:null,
 init(){const nav=$('#nav');nav.innerHTML=NAV.map(([k,t,i])=>`<button data-p="${k}" class="${k==='world'?'on':''}" aria-label="${t}">${ic(i,22)}<span>${t}</span><i class="dot" data-dot="${k}" hidden></i></button>`).join('');
  nav.onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;U.buzz(5);const k=b.dataset.p;if(k==='world')this.close();else if(k==='more')this.settings();else this.open(k)};
  U.on('pending',()=>this.dots());U.on('quests',()=>this.dots());this.dots()},
 dots(){const q=$('[data-dot=life]');if(q)q.hidden=!OC.Quests.ready()},
 open(k,tab){const pg=$('#page');this.cur=k;this.tab=tab||this.tab;pg.className='page on p-'+k;
  $$('#nav [data-p]').forEach(b=>U.toggle(b,'on',b.dataset.p===k));UI.syncBlock();
  this.render();OC.Loop.renderOn=false;pg.scrollTop=0},
 close(){if(!this.cur)return;this.cur=null;const pg=$('#page');pg.className='page';$$('#nav [data-p]').forEach(b=>U.toggle(b,'on',b.dataset.p==='world'));OC.Loop.renderOn=true;UI.syncBlock();OC.R.skey=''},
 render(){const pg=$('#page');const k=this.cur;let h='';
  if(k==='chars')h=this.chars();else if(k==='map')h=this.map();else if(k==='life')h=this.life();
  pg.innerHTML=`<div class="pg-in">${h}</div>`;OC.Rig.fillImgs(pg);this.bind(pg)},
 /* ================= 角色頁 ================= */
 chars(){const list=OC.S.chars;const cards=list.map(c=>{const a=Sim.get(c.id),m=C.MOODS[c.mood]||C.MOODS.content;const st=c.onIsland===false?'休息中（不在島上）':a?(a.task?a.task.def.t:'閒晃')+' · '+C.LOC[c.loc].t:'';
   return`<article class="cc ${OC.S.activeId===c.id?'act':''}" data-cid="${c.id}"><div class="cc-art">${OC.Rig.avatarHTML(c)}</div><div class="cc-b"><b>${esc(c.name)}</b><small>${esc(Chars.sub(c))}</small>
    <div class="cc-tags"><em style="background:${m.c}">${m.t}</em>${c.health.sick?`<em class="sick">${C.SICK[c.health.sick].t}</em>`:''}${OC.S.petIds.includes(c.id)?'<em class="pet">桌寵</em>':''}${OC.S.activeId===c.id?'<em class="ctl">操控中</em>':''}</div><p>${esc(st)}</p></div>
    <div class="cc-a"><button class="chip ${c.onIsland!==false?'on':''}" data-isl="${c.id}">${c.onIsland!==false?'在島上':'加入小島'}</button><button class="chip ${OC.S.petIds.includes(c.id)?'on':''}" data-pet="${c.id}">桌寵</button></div></article>`}).join('');
  const rels=this.relSummary();
  return`<header class="ph"><h1>角色</h1><p>${list.length} 位夥伴 · 點卡片看完整檔案</p><button class="icon-btn" data-new>${ic('plus')}</button></header><div class="cards">${cards}</div>
   <h3 class="sec">人際關係</h3><div class="rels">${rels||'<p class="empty">夥伴們還不太熟。讓大家一起生活吧！</p>'}</div>`},
 relSummary(){const ch=OC.S.chars;const out=[];for(let i=0;i<ch.length;i++)for(let j=i+1;j<ch.length;j++){const r=OC.S.rel[ch[i].id<ch[j].id?ch[i].id+'|'+ch[j].id:ch[j].id+'|'+ch[i].id];if(!r)continue;const s=OC.Social.status(r);
  out.push(`<button class="rel s-${s}" data-rel="${ch[i].id}|${ch[j].id}"><span class="hav sm">${OC.Rig.avatarHTML(ch[i])}</span><span class="hav sm">${OC.Rig.avatarHTML(ch[j])}</span><b>${OC.Social.LBL[s]}</b><i><u style="width:${(r.f+100)/2}%"></u></i></button>`)}return out.join('')},
 relSheet(a,b){const A=OC.S.chars.find(c=>c.id===a),B=OC.S.chars.find(c=>c.id===b),r=OC.Social.rel(a,b),s=OC.Social.status(r);
  const s2=UI.sheet(`<div class="pair"><span class="hav lg">${OC.Rig.avatarHTML(A)}</span><span class="vs">${s==='broken'?'⚡':s==='lovers'?'💗':'♥'}</span><span class="hav lg">${OC.Rig.avatarHTML(B)}</span></div><h2>${esc(A.name)} × ${esc(B.name)}</h2><p class="lead">${OC.Social.LBL[s]}</p>
   <div class="nbs">${[['好感',(r.f+100)/2,'#F08FA5'],['信任',r.trust,'#8CC3A0'],['熟悉',Math.min(100,r.fam*2),'#9BB7E0'],['衝突',r.conf,'#E57B72']].map(([t,v,c])=>`<div class="nb"><span>${t}</span><i><b style="width:${v|0}%;background:${c}"></b></i></div>`).join('')}</div>
   <h3 class="sec">共同回憶</h3>${r.mem.length?r.mem.slice(0,8).map(m=>`<p class="log">${m.val>0?'🌼':'🌧️'} ${esc(m.text)}</p>`).join(''):'<p class="empty">還沒有共同回憶</p>'}
   <h3 class="sec">關係設定</h3><div class="chips">${[['','自然發展'],['family','家人'],['rival','競爭對手']].map(([k,t])=>`<button class="chip ${(r.tag||'')===k?'on':''}" data-tag="${k}">${t}</button>`).join('')}<button class="chip ${r.noRomance?'':'on'}" data-rom>${r.noRomance?'不允許戀愛':'允許戀愛發展'}</button></div>
   ${r.broken||r.conf>30?`<button class="btn primary wide" data-med>介入調解</button>`:''}${r.lovers?`<button class="btn ghost wide" data-unlove>結束戀人關係</button>`:''}`,{});OC.Rig.fillImgs(s2.el);
  s2.el.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.tag!=null){r.tag=t.dataset.tag||null}else if(t.hasAttribute('data-rom'))r.noRomance=!r.noRomance;else if(t.hasAttribute('data-med')){const res=OC.Social.mediate(a,b);UI.toast(res.ok?'調解成功！':'還需要一點時間…',res.ok?'heart':'info')}else if(t.hasAttribute('data-unlove')){r.lovers=false;Sim.log(null,`${A.name}和${B.name}決定回到朋友關係。`,'cloud')}else return;OC.Store.save();s2.close();this.relSheet(a,b);if(this.cur==='chars')this.render()})},
 /* 角色檔案（查看用） */
 profile(id){const c=OC.S.chars.find(x=>x.id===id);if(!c)return;const tp=Chars.typeName(c);const P=c.profile;
  const field=(k,v)=>v?`<div class="kv"><span>${k}</span><b>${esc(v)}</b></div>`:'';
  const traits=c.traits.map(t=>C.TRAIT[t]).filter(Boolean).map(t=>`<span class="tr" title="${esc(t.d)}">${t.em} ${esc(t.t)}</span>`).join('');
  const quirks=Object.entries(C.Q).map(([k,q])=>{const o=q.o.find(x=>x[0]===c.quirks[k]);return`<div class="kv"><span>${q.t}</span><b>${o?o[1]:'—'}</b></div>`}).join('')+(c.phrase?`<div class="kv"><span>口癖</span><b>「${esc(c.phrase)}」</b></div>`:'');
  const prefs=C.TASTES.map(([k,t])=>{const v=c.foodPref[k]??0,p=C.PREF.find(x=>x[0]===v);return`<span class="pf" style="--c:${p[2]}">${t}<b>${p[1]}</b></span>`}).join('');
  const seen=Object.entries(c.foodSeen||{}).map(([id,v])=>{const it=C.ITEM[id];return it?`<span class="pf" style="--c:${C.PREF.find(x=>x[0]===v)[2]}">${it.em}${esc(it.name)}</span>`:''}).join('');
  const skills=Object.entries(c.skills).map(([k,v])=>{const N={cooking:'料理',gardening:'園藝',fishing:'釣魚',reading:'閱讀',social:'社交',explore:'探索',fitness:'運動',creativity:'創意'};return`<div class="nb"><span>${N[k]} Lv.${Math.floor(v/20)}</span><i><b style="width:${v%20*5}%;background:#9BB7E0"></b></i></div>`}).join('');
  const rels=OC.S.chars.filter(o=>o.id!==c.id).map(o=>{const r=OC.Social.rel(c.id,o.id);return`<button class="rel s-${OC.Social.status(r)}" data-rel="${c.id}|${o.id}"><span class="hav sm">${OC.Rig.avatarHTML(o)}</span><b>${esc(o.name)}</b><small>${OC.Social.label(r)}</small><i><u style="width:${(r.f+100)/2}%"></u></i></button>`}).join('');
  const mems=c.memories.slice(0,14).map(m=>`<p class="log">${m.val>.3?'🌼':m.val<-.3?'🌧️':'🍃'} ${esc(m.text)}<small>${new Date(m.t).toLocaleDateString('zh-TW')} · ${esc(C.LOC[m.loc]?.t||'')}</small></p>`).join('');
  const story=OC.S.log.filter(l=>l.id===c.id||l.text.includes(c.name)).slice(0,14).map(l=>`<p class="log">${esc(l.text)}<small>${new Date(l.t).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small></p>`).join('');
  const fav=Object.entries(c.counters).filter(([k])=>!k.startsWith('_')).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,n])=>`${OC.Acts.ACT[k]?.t||k}（${n} 次）`).join('、');
  const placeCnt={};for(const m of c.memories)placeCnt[m.loc]=(placeCnt[m.loc]||0)+1;const favLoc=Object.entries(placeCnt).sort((a,b)=>b[1]-a[1])[0];
  const tabs=[['base','基本'],['pers','性格'],['life','生活'],['rel','關係'],['mem','回憶']];
  const s=UI.sheet(`<div class="pf-h"><div class="pf-art">${OC.Rig.avatarHTML(c)}</div><div><h2>${esc(c.name)}</h2><p class="lead">${esc(tp[0])} · ${esc(tp[1])}</p><div class="row"><button class="btn primary" data-edit>${ic('edit')}編輯</button><button class="btn" data-act>${ic('locate')}操控</button><button class="btn ghost" data-more>${ic('more')}</button></div></div></div>
   <div class="tabs" data-tabs>${tabs.map(([k,t],i)=>`<button data-tab="${k}" class="${i?'':'on'}">${t}</button>`).join('')}</div>
   <div class="tab on" data-p="base">${field('暱稱',P.nick)}${field('生日',P.birthday)}${field('年齡',P.age)}${field('性別',P.gender)}${field('代稱',P.pronoun)}${field('種族',P.species)}${field('身高',P.height)}${(P.fields||[]).map(f=>field(f.k,f.v)).join('')}
    ${P.bio?`<h3 class="sec">介紹</h3><p class="txt">${esc(P.bio)}</p>`:''}${P.story?`<h3 class="sec">背景故事</h3><p class="txt">${esc(P.story)}</p>`:''}
    ${P.likes.length?`<div class="kv"><span>喜歡</span><b>${esc(P.likes.join('、'))}</b></div>`:''}${P.dislikes.length?`<div class="kv"><span>討厭</span><b>${esc(P.dislikes.join('、'))}</b></div>`:''}${P.interests.length?`<div class="kv"><span>興趣</span><b>${esc(P.interests.join('、'))}</b></div>`:''}</div>
   <div class="tab" data-p="pers"><div class="sls">${C.SLIDERS.map(sl=>`<div class="sl"><span>${sl.a}</span><i><b style="left:${c.sliders[sl.k]}%"></b></i><span>${sl.b}</span></div>`).join('')}</div><h3 class="sec">特質</h3><div class="trs">${traits||'<p class="empty">尚未設定</p>'}</div><h3 class="sec">小怪癖</h3>${quirks}</div>
   <div class="tab" data-p="life"><h3 class="sec">生活需求</h3><div class="nbs">${C.NEEDS.map(([k,t,col])=>`<div class="nb"><span>${t}</span><i><b style="width:${c.needs[k]|0}%;background:${col}"></b></i></div>`).join('')}</div>
    ${c.health.sick?`<p class="warn">目前${C.SICK[c.health.sick].t}：${C.SICK[c.health.sick].d}</p>`:''}
    <h3 class="sec">願望</h3>${c.wishes.length?c.wishes.map(w=>`<p class="log">💭 ${esc(Sim.wishText(c,w))}</p>`).join(''):'<p class="empty">目前沒有特別的願望</p>'}
    <h3 class="sec">興趣技能</h3><div class="nbs">${skills}</div>
    <h3 class="sec">生活習慣</h3><p class="txt">${fav?'最常做的事：'+esc(fav):'還在探索自己的生活方式。'}${favLoc?`<br>最常待的地方：${esc(C.LOC[favLoc[0]]?.t||'')}`:''}</p>
    <h3 class="sec">飲食喜好</h3><div class="pfs">${prefs}</div>${seen?`<h3 class="sec">吃過的東西</h3><div class="pfs">${seen}</div>`:''}<p class="hint">飲食喜好可在「編輯」中修改。</p></div>
   <div class="tab" data-p="rel"><div class="rels">${rels||'<p class="empty">島上只有自己</p>'}</div></div>
   <div class="tab" data-p="mem"><h3 class="sec">回憶</h3>${mems||'<p class="empty">還沒有回憶</p>'}<h3 class="sec">生活故事</h3>${story||'<p class="empty">故事才剛開始</p>'}</div>`,{full:true});OC.Rig.fillImgs(s.el);
  s.el.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
   if(t.dataset.tab){s.el.querySelectorAll('[data-tab]').forEach(b=>U.toggle(b,'on',b===t));s.el.querySelectorAll('.tab').forEach(p=>U.toggle(p,'on',p.dataset.p===t.dataset.tab))}
   else if(t.hasAttribute('data-edit')){s.close();OC.Editor.open(c.id)}
   else if(t.hasAttribute('data-act')){s.close();this.close();UI.setActive(c.id,true)}
   else if(t.dataset.rel){const [a,b]=t.dataset.rel.split('|');this.relSheet(a,b)}
   else if(t.hasAttribute('data-more')){UI.menu(`<h2>${esc(c.name)}</h2><div class="am-g"><button data-m="dup">${ic('plus')}<span>複製</span></button><button data-m="exp">${ic('book')}<span>匯出角色</span></button><button data-m="del">${ic('trash')}<span>刪除</span></button></div>`,async m=>{
     if(m==='dup'){const n=JSON.parse(JSON.stringify(c));n.id=U.uid('c');n.name=c.name+' 2';n.memories=[];n.demo=null;OC.S.chars.push(OC.Chars.ensure(n));U.emit('chars');OC.Store.flush();UI.toast('已複製角色');s.close();this.render()}
     else if(m==='exp'){const j=await OC.Store.exportChar(c.id);OC.Pages.download(j,`${c.name}.ocschar.json`)}
     else if(m==='del'){if(OC.S.chars.length<=1){UI.toast('至少要保留一位夥伴','warn');return}if(await UI.confirm({title:`刪除 ${c.name}？`,msg:'角色資料與回憶會被移除，無法復原。建議先匯出備份。',ok:'刪除',danger:true})){OC.S.chars=OC.S.chars.filter(x=>x!==c);OC.S.petIds=OC.S.petIds.filter(x=>x!==c.id);for(const k of Object.keys(OC.S.rel))if(k.split('|').includes(c.id))delete OC.S.rel[k];if(OC.S.activeId===c.id)OC.S.activeId=OC.S.chars[0].id;U.emit('chars');OC.Store.flush();s.close();if(this.cur==='chars')this.render()}}})}})},
 /* ================= 地圖 ================= */
 map(){const here=OC.R.sc.id;const pos={home:[30,58],house:[22,40],plaza:[58,36],beach:[74,72],forest:[30,18]};
  const who=id=>[...Sim.agents.values()].filter(a=>a.loc===id&&!a.away);
  const pins=C.LOCS.map(l=>{const [x,y]=pos[l.id];const w=who(l.id);const ok=OC.S.world.unlocked.includes(l.id)&&(l.id!=='house'||(OC.S.world.house&&OC.S.world.house.placed));
   return`<button class="pin ${here===l.id?'here':''} ${ok?'':'lock'}" style="left:${x}%;top:${y}%" data-go="${l.id}"><span class="pi">${l.ic}</span><b>${l.t}</b>${w.length?`<span class="pw">${w.slice(0,3).map(a=>`<span class="hav xs">${OC.Rig.avatarHTML(a.c)}</span>`).join('')}</span>`:''}</button>`}).join('');
  const list=C.LOCS.map(l=>{const w=who(l.id);return`<button class="loc-r" data-go="${l.id}"><span class="pi">${l.ic}</span><div><b>${l.t}${here===l.id?' · 你在這裡':''}</b><small>${esc(l.d)}</small><small>${w.length?w.map(a=>esc(a.c.name)+'（'+esc(a.task?a.task.def.t:'閒晃')+'）').join('、'):'目前沒有夥伴'}</small></div></button>`}).join('');
  return`<header class="ph"><h1>世界地圖</h1><p>點地點即可前往；夥伴們也會自己到處去</p></header><div class="wmap"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M30 58 Q44 46 58 36 M58 36 Q68 54 74 72 M30 58 Q28 36 30 18 M30 58 L22 40" fill="none" stroke="#F6EBD3" stroke-width="1.6" stroke-dasharray="2 2"/></svg>${pins}</div><div class="locs">${list}</div>`},
 goWith(a){UI.menu(`<h2>帶 ${esc(a.c.name)} 去哪裡？</h2><div class="am-g">${C.LOCS.filter(l=>l.id!=='house'||(OC.S.world.house&&OC.S.world.house.placed)).map(l=>`<button data-m="${l.id}"><span class="pe">${l.ic}</span><span>${l.t}</span></button>`).join('')}</div>`,id=>{Sim.sendTo(a,id);a.say(`走吧，去${C.LOC[id].t}！`);if(id!==OC.R.sc.id)setTimeout(()=>OC.World.go(id,{focus:a}),1400)})},
 /* ================= 小島日常 ================= */
 life(){const t=this.tab||'quest';const tabs=[['quest','任務'],['shop','商店'],['codex','圖鑑'],['story','生活故事'],['home','家與佈置']];
  let b='';
  if(t==='quest'){const Q=OC.S.quests;b=`<div class="streak">連續生活 <b>${Q.streak||1}</b> 天</div>`+(Q.list||[]).map((q,i)=>`<div class="qrow ${q.done?'done':''}"><div><b>${esc(q.t)}</b><i><u style="width:${Math.min(100,q.p/q.n*100)}%"></u></i><small>${Math.min(q.p,q.n)} / ${q.n}</small></div><button class="btn ${q.p>=q.n&&!q.done?'primary':'ghost'}" data-claim="${i}" ${q.p>=q.n&&!q.done?'':'disabled'}>${q.done?'已領取':UI.COIN+' '+q.r}</button></div>`).join('')}
  else if(t==='shop'){b=`<p class="lead">商店在<b>中央廣場</b>。也可以直接在這裡下單，東西會送到背包。</p><div class="row">${Object.entries(OC.Shop.SHOPS).map(([k,s])=>`<button class="btn" data-shop="${k}">${s.t}</button>`).join('')}</div><h3 class="sec">賣出收藏</h3>`+(Items.list().filter(i=>i.sell).map(i=>`<div class="qrow"><div><b>${i.em} ${esc(i.name)} ×${i.q}</b><small>每個 ${i.sell} 星幣</small></div><button class="btn" data-sell="${i.id}">賣 1 個</button></div>`).join('')||'<p class="empty">去海灘、森林找找收藏吧</p>')}
  else if(t==='codex'){const groups=[['fish','魚類'],['bug','昆蟲'],['col','收藏'],['food','食物'],['drink','飲料']];const own=OC.S.codex;let got=0,all=0;
   b=groups.map(([k,n])=>{const L=C.ITEMS.filter(i=>i.cat===k);all+=L.length;return`<h3 class="sec">${n}</h3><div class="cx">${L.map(i=>{const o=own[i.id];if(o)got++;return`<div class="cxi ${o?'':'no'}" title="${esc(i.name)}"><span>${o?i.em:'？'}</span><small>${o?esc(i.name):'未發現'}</small></div>`}).join('')}</div>`}).join('');b=`<p class="lead">已發現 ${got} / ${all}</p>`+b}
  else if(t==='story'){b=OC.S.log.slice(0,60).map(l=>`<p class="log">${esc(l.text)}<small>${new Date(l.t).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small></p>`).join('')||'<p class="empty">故事才剛開始</p>'}
  else if(t==='home'){const H=OC.S.world.house;const furn=(OC.S.world.houseFurn||[]);const inv=Items.list('furn');
   b=`<div class="qrow"><div><b>🏠 ${H&&H.placed?esc(C.HOUSES.find(h=>h.id===H.style)?.t||''):'還沒有房子'}</b><small>${H&&H.placed?'在家園小島上':'選一棟房子放在小島上吧'}</small></div><button class="btn primary" data-house>${H&&H.placed?'搬家／換房子':'選擇房子'}</button></div>
    <h3 class="sec">屋內家具（${furn.length}）</h3><div class="cx">${furn.map(f=>{const it=C.ITEMS.find(i=>i.furn===f.k);return`<button class="cxi" data-fmove="${f.id}"><span>${it?it.em:'🪑'}</span><small>${it?esc(it.name):f.k}</small></button>`}).join('')}</div><p class="hint">點家具可以在屋內重新擺放。</p>
    ${inv.length?`<h3 class="sec">尚未擺放</h3><div class="cx">${inv.map(i=>`<button class="cxi" data-fplace="${i.id}"><span>${i.em}</span><small>${esc(i.name)}</small></button>`).join('')}</div>`:''}`}
  return`<header class="ph"><h1>小島日常</h1><p>${UI.COIN} <b>${OC.S.coins}</b> 星幣</p></header><div class="tabs">${tabs.map(([k,n])=>`<button data-ltab="${k}" class="${t===k?'on':''}">${n}</button>`).join('')}</div><div class="lb">${b}</div>`},
 /* 商店介面 */
 shop(k){const S=OC.Shop.SHOPS[k],st=OC.Shop.stock(k);const draw=()=>`<h2>${k==='cafe'?'☕':k==='gift'?'🎁':'🛒'} ${S.t}</h2><p class="lead">${UI.COIN} <b>${OC.S.coins}</b> · 每天會換新商品</p><div class="shop">${st.items.map(id=>{const it=C.ITEM[id],p=OC.Shop.price(k,id);return`<button class="si" data-buy="${id}"><span class="se">${it.em}</span><b>${esc(it.name)}</b><small>${esc(it.desc||C.CATNAME[it.cat])}</small><em>${st.sale===id?'<s>'+it.price+'</s> ':''}${UI.COIN}${p}</em>${Items.qty(id)?`<i>擁有 ${Items.qty(id)}</i>`:''}</button>`}).join('')}</div>`;
  const s=UI.sheet(draw(),{cls:'shop-s'});s.el.addEventListener('click',e=>{const b=e.target.closest('[data-buy]');if(!b)return;const id=b.dataset.buy;if(OC.Shop.buy(k,id)){U.buzz(10);b.classList.remove('bought');void b.offsetWidth;b.classList.add('bought');UI.toast(`買了 ${C.ITEM[id].em}${C.ITEM[id].name}`,'check');setTimeout(()=>{if(!s.closed){s.body.innerHTML=draw()}},380);if(C.ITEM[id].cat==='furn')setTimeout(()=>this.placeFurn(id),500)}})},
 placeFurn(id){const it=C.ITEM[id];if(!it||!it.furn)return;if(!Items.take(id))return;const F=OC.S.world.houseFurn||(OC.S.world.houseFurn=[]);const sc=OC.Scenes.get('house');
  let p={x:U.rnd(-2.5,2.5),z:U.rnd(-1.5,1.5)};for(let i=0;i<30;i++){const q={x:U.rnd(-3,3),z:U.rnd(-1.8,1.8)};if(!F.some(f=>Math.hypot(f.x-q.x,f.z-q.z)<1.4)){p=q;break}}
  F.push({id:U.uid('f'),k:it.furn,x:+p.x.toFixed(2),z:+p.z.toFixed(2)});OC.Scenes.syncFurn();OC.Store.flush();UI.toast(`${it.name}已擺進屋裡`,'check');if(this.cur==='life')this.render()},
 /* ================= 時間與天氣 ================= */
 timeWeather(){const W=Env.WX;const off=OC.S.world.timeOffset||0;const s=UI.sheet(`<h2>時間與天氣</h2><p class="lead">${Env.label().date} ${Env.label().time}</p>
  <h3 class="sec">時間</h3><div class="chips">${[['real','現在（實際時間）',0],['m','清晨 6:30',6.5],['d','中午 12:00',12],['e','黃昏 18:00',18],['n','夜晚 21:00',21]].map(([k,t,h])=>`<button class="chip" data-h="${h}">${t}</button>`).join('')}</div>
  <h3 class="sec">天氣</h3><div class="chips"><button class="chip ${!OC.S.world.weather?'on':''}" data-w="">自動</button>${Object.entries(W).map(([k,v])=>`<button class="chip ${OC.S.world.weather===k?'on':''}" data-w="${k}">${v.ic} ${v.t}</button>`).join('')}</div><p class="hint">調整後畫面會平順過渡，夥伴的作息也會跟著改變。</p>`);
  s.el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.h!=null){const h=+b.dataset.h;if(!h)OC.S.world.timeOffset=0;else{const d=new Date();const cur=d.getHours()+d.getMinutes()/60;OC.S.world.timeOffset=Math.round((h-cur)*3600e3)}}
   else if(b.dataset.w!=null){OC.S.world.weather=b.dataset.w||null}else return;Env._k=-1;Env.update();OC.R.skey='';UI.hudTime(true);OC.Store.save();s.close();this.timeWeather()})},
 /* ================= 設定 ================= */
 settings(){const st=OC.S.settings,cu=st.custom;const modes=[['quality','高畫質','完整光影、粒子、環境動態'],['balanced','平衡','一般手機推薦'],['battery','省電','30 FPS、降低特效與解析度'],['custom','自訂','自己調整每一項']];
  const sw=(k,t,d)=>`<label class="sw"><span><b>${t}</b><small>${d||''}</small></span><input type="checkbox" data-s="${k}" ${st[k]!==false?'checked':''}><i></i></label>`;
  const s=UI.sheet(`<h2>設定</h2>
   <h3 class="sec">畫質與效能</h3><div class="modes">${modes.map(([k,t,d])=>`<button class="mode ${st.perf===k?'on':''}" data-perf="${k}"><b>${t}</b><small>${d}</small></button>`).join('')}</div>
   <div class="custom" ${st.perf==='custom'?'':'hidden'}>
    ${[['fps','FPS 上限',[[30,'30'],[60,'60']]],['scale','渲染解析度',[[1,'低'],[1.5,'中'],[2,'高'],[3,'最高']]],['shadows','地面細節',[[0,'關'],[1,'開'],[2,'高']]],['particles','粒子數量',[[0,'無'],[.3,'少'],[.6,'中'],[1,'多']]],['ambient','環境動畫',[[0,'關'],[1,'開'],[2,'豐富']]],['cloudShadow','雲影',[[0,'關'],[1,'開']]],['maxChars','同時顯示角色',[[4,'4'],[6,'6'],[10,'10'],[16,'16']]]].map(([k,t,o])=>`<div class="opt"><span>${t}</span><div class="seg">${o.map(([v,n])=>`<button data-c="${k}" data-v="${v}" class="${cu[k]==v?'on':''}">${n}</button>`).join('')}</div></div>`).join('')}</div>
   <div class="opt"><span>減少動態效果</span><div class="seg">${[['system','跟隨系統'],['full','完整'],['reduce','減少']].map(([v,n])=>`<button data-motion="${v}" class="${st.motion===v?'on':''}">${n}</button>`).join('')}</div></div>
   <div class="opt"><span>外觀主題</span><div class="seg">${[['system','跟隨系統'],['light','淺色'],['dark','深色']].map(([v,n])=>`<button data-theme="${v}" class="${st.theme===v?'on':''}">${n}</button>`).join('')}</div></div>
   <h3 class="sec">生活模擬</h3>${sw('autoSocial','夥伴自主社交','自己聊天、玩耍、拜訪')}${sw('negEvents','負面經歷','吵架、生病、心情低落等（重大變化仍會詢問你）')}${sw('romance','戀愛發展','成為戀人前一定會先問你')}
   <h3 class="sec">畫面</h3>${sw('bubbles','對話泡泡')}${sw('names','名字標籤')}${sw('haptics','觸覺回饋')}
   <h3 class="sec">Android 桌寵</h3>${OC.Native.has()?`<button class="btn wide" data-petset>桌寵設定</button>`:'<p class="hint">系統級懸浮桌寵需要安裝 Android App 版本。在角色卡片按「桌寵」即可選擇要顯示的夥伴。</p>'}
   <h3 class="sec">資料</h3><div class="col"><button class="btn" data-exp>匯出完整備份（含圖片）</button><button class="btn" data-imp>匯入備份</button>${OC.Store.hasLegacy()?'<button class="btn" data-legacy>重新從 3.2 舊版匯入夥伴</button>':''}<button class="btn" data-intro>重看開場動畫</button><button class="btn" data-tut>重看新手引導</button><button class="btn ghost danger-t" data-reset>重新開始遊戲</button></div>
   <p class="hint ver">OC Shimeji v4.0 · FPS ${OC.Loop.fps}</p>`,{full:true});
  s.el.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const re=()=>{s.close();this.settings()};
   if(b.dataset.perf){st.perf=b.dataset.perf;OC.R.resize();OC.R.skey='';OC.Store.save();re()}
   else if(b.dataset.c){cu[b.dataset.c]=+b.dataset.v;OC.R.resize();OC.R.skey='';OC.Store.save();re()}
   else if(b.dataset.motion){st.motion=b.dataset.motion;applyTheme();OC.Store.save();re()}
   else if(b.dataset.theme){st.theme=b.dataset.theme;applyTheme();OC.Store.save();re()}
   else if(b.hasAttribute('data-exp')){this.download(await OC.Store.exportAll(),`oc-shimeji-backup-${U.dayKey()}.json`)}
   else if(b.hasAttribute('data-imp')){const t=await this.pickFile('.json,application/json');if(t)try{await OC.Store.importAll(t)}catch(err){UI.toast(err.message,'warn')}}
   else if(b.hasAttribute('data-legacy')){const n=await OC.Store.importLegacy();Sim.sync();UI.toast(`匯入了 ${n} 位夥伴（已存在的不重複）`,'check')}
   else if(b.hasAttribute('data-intro')){s.close();OC.Intro.replay()}
   else if(b.hasAttribute('data-tut')){s.close();OC.Tutorial.start()}
   else if(b.hasAttribute('data-petset')){OC.Native.settings()}
   else if(b.hasAttribute('data-reset')){if(await UI.confirm({title:'重新開始？',msg:'目前的島嶼、夥伴與進度都會清除。建議先匯出備份。',ok:'清除並重新開始',danger:true}))OC.Store.reset()}});
  s.el.addEventListener('change',e=>{const k=e.target.dataset.s;if(!k)return;st[k]=e.target.checked;OC.Store.save()})},
 download(text,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);if(OC.Native.has())OC.Native.saveFile(name,text);UI.toast('已匯出','check')},
 pickFile(accept,asData){return new Promise(res=>{const i=$('#fileIn');i.accept=accept;i.value='';i.onchange=()=>{const f=i.files[0];if(!f){res(null);return}const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);asData?r.readAsDataURL(f):r.readAsText(f)};i.click()})},
 /* ================= 事件綁定 ================= */
 bind(pg){pg.onclick=async e=>{const t=e.target.closest('[data-cid],[data-isl],[data-pet],[data-new],[data-rel],[data-go],[data-ltab],[data-claim],[data-shop],[data-sell],[data-house],[data-fmove],[data-fplace]');if(!t)return;U.buzz(5);
  if(t.dataset.isl){e.stopPropagation();const c=OC.S.chars.find(x=>x.id===t.dataset.isl);c.onIsland=c.onIsland===false;if(c.onIsland){c.loc='home';c.x=null;Sim.sync();UI.toast(`${c.name}回到小島了`,'heart')}else{if([...Sim.agents.keys()].length<=1){c.onIsland=true;UI.toast('島上至少要有一位夥伴','warn');return}Sim.sync()}OC.Store.save();this.render();return}
  if(t.dataset.pet){e.stopPropagation();const id=t.dataset.pet;const P=OC.S.petIds;if(P.includes(id))OC.S.petIds=P.filter(x=>x!==id);else{if(P.length>=(OC.S.settings.petMax||2))P.shift();P.push(id)}OC.Store.flush();OC.Native.syncPets(true);this.render();if(!OC.Native.has())UI.toast('已設為桌寵。安裝 Android 版即可在手機桌面上顯示','info');return}
  if(t.dataset.cid){this.profile(t.dataset.cid);return}
  if(t.hasAttribute('data-new')){OC.Editor.create();return}
  if(t.dataset.rel){const [a,b]=t.dataset.rel.split('|');this.relSheet(a,b);return}
  if(t.dataset.go){const id=t.dataset.go;if(t.classList.contains('lock')){UI.toast(id==='house'?'先在家園放一棟房子':'尚未解鎖','info');return}this.close();if(id!==OC.R.sc.id)OC.World.go(id);return}
  if(t.dataset.ltab){this.tab=t.dataset.ltab;this.render();return}
  if(t.dataset.claim!=null){const q=OC.S.quests.list[+t.dataset.claim];if(OC.Quests.claim(q)){UI.celebrate(null,`+${q.r} 星幣`,'任務完成');this.render()}return}
  if(t.dataset.shop){this.shop(t.dataset.shop);return}
  if(t.dataset.sell){if(OC.Shop.sell(t.dataset.sell)){UI.toast(`賣出 +${C.ITEM[t.dataset.sell].sell} 星幣`,'coin');this.render()}return}
  if(t.hasAttribute('data-house')){this.close();OC.Intro.houseOnly(true);return}
  if(t.dataset.fplace){this.placeFurn(t.dataset.fplace);return}
  if(t.dataset.fmove){this.close();OC.World.go('house');setTimeout(()=>OC.Intro.moveFurn(t.dataset.fmove),500)}}}};
function $$(s,r=document){return[...r.querySelectorAll(s)]}
function applyTheme(){const st=OC.S.settings,r=document.documentElement;const d=st.theme==='dark'||(st.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'dark':'light';r.dataset.motion=OC.Store.perf().reduce?'reduce':'full';const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#1F2630':'#F6F0E4'}
Pages.applyTheme=applyTheme;
OC.Pages=Pages;
})(window.OC);

</script>
<script data-src="ui/editor.js">
/* OC Shimeji v4 · 角色編輯器（創角／捏角／性格／飲食／資料），即時動畫預覽 */
(function(OC){'use strict';
const {U,Content:C,Chars,UI}=OC;const {$,esc}=U;const ic=UI.ic;
const OPT_T={head:'臉型',ears:'耳朵',eye:'眼睛',brow:'眉毛',cheekStyle:'臉頰',mouth:'嘴巴',pattern:'花紋',tail:'尾巴',tailSide:'尾巴位置',acc:'服裝',smallAcc:'小配件'};
const RNG_T={headSize:'頭部大小',earSize:'耳朵大小',eyeSize:'眼睛大小',eyeSpace:'眼距',eyeY:'眼睛高度',mouthY:'嘴巴高度',cheeks:'腮紅濃度',accX:'配件左右',accY:'配件上下',accScale:'配件大小',accRot:'配件角度'};
const Editor={
 create(after){const c=OC.Chars.make({name:'',look:OC.CAT_RAND(),traits:[]});c._new=true;c.name=U.pick(['小栗','雪糕','麻吉','七七','團團','芝麻','布丁','小滿','可可','阿墨']);this.open(null,c,after)},
 open(id,draft,after){const src=draft||OC.S.chars.find(c=>c.id===id);if(!src)return;const c=JSON.parse(JSON.stringify(src));this.c=c;this.isNew=!!draft;this.after=after;this.tab='look';

<script data-src="core/main.js">
/* OC Shimeji v4 · 主迴圈、輸入、相機跟隨、啟動流程 */
(function(OC){'use strict';
const {U,R,Env,Sim}=OC;
const Loop={timeScale:1,raf:0,last:0,acc:0,paused:false,renderOn:true,fpsN:0,fpsT:0,fps:0,
 start(){if(this.raf)return;this.last=performance.now();this.raf=requestAnimationFrame(t=>this.frame(t))},
 stop(){cancelAnimationFrame(this.raf);this.raf=0},
 frame(t){this.raf=requestAnimationFrame(n=>this.frame(n));const perf=OC.Store.perf();const minDt=1000/perf.fps-1.5;const el=t-this.last;if(el<minDt)return;
  const dt=Math.min(.1,el/1000);this.last=t;this.fpsN++;this.fpsT+=el;if(this.fpsT>1000){this.fps=Math.round(this.fpsN*1000/this.fpsT);this.fpsN=0;this.fpsT=0}
  Env.update();/* 模擬以固定小步長前進，避免卡頓時角色穿過障礙物 */let sdt=dt*(this.timeScale||1);while(sdt>1e-4){const st=Math.min(.05,sdt);sdt-=st;Sim.tick(st);OC.Social.tick(st)}Cam.update(dt);
  if(this.renderOn){try{R.frame(dt)}catch(e){console.error('[render]',e);this.err=(this.err||0)+1}}
  OC.UI&&OC.UI.frame&&OC.UI.frame(dt)}};

/* ---------- 相機：跟隨、平移、縮放，全部有慣性 ---------- */
const Cam={follow:true,focus:null,goal:{tx:0,tz:0,D:16},vel:{x:0,z:0},
 set(tx,tz,D,instant){this.goal={tx,tz,D:D??this.goal.D};if(instant){R.cam.tx=tx;R.cam.tz=tz;R.cam.D=this.goal.D}},
 limits(){const sc=R.sc;return sc.kind==='room'?{D:[7,13],b:[-1.6,-1,1.6,1.4]}:{D:[9,30],b:[sc.bounds[0]+2,sc.bounds[1]+2,sc.bounds[2]-2,sc.bounds[3]-1]}},
 update(dt){const c=R.cam,L=this.limits();
  if(this.follow&&this.focus&&!this.focus.away&&this.focus.loc===R.sc.id&&!Input.drag){const f=this.focus;const dx=f.x-this.goal.tx,dz=f.z-this.goal.tz;const dead=OC.Store.perf().fps<40?1.6:.9;
   if(Math.abs(dx)>dead)this.goal.tx+=dx-Math.sign(dx)*dead;if(Math.abs(dz)>dead*.7)this.goal.tz+=dz-Math.sign(dz)*dead*.7}

/* ---------- 觸控輸入 ---------- */
const Input={ptrs:new Map(),drag:null,pinch:null,press:null,
 init(cv){this.cv=cv;cv.addEventListener('pointerdown',e=>this.down(e));window.addEventListener('pointermove',e=>this.move(e),{passive:false});window.addEventListener('pointerup',e=>this.up(e));window.addEventListener('pointercancel',e=>this.up(e,true));
  cv.addEventListener('wheel',e=>{e.preventDefault();Cam.goal.D*=Math.exp(e.deltaY*.0012)},{passive:false});cv.addEventListener('contextmenu',e=>e.preventDefault())},

 hitObj(x,y){let best=null;for(const p of R.pick){if(x>p.x+p.w*.15&&x<p.x+p.w*.85&&y>p.y+p.h*.15&&y<p.y+p.h){if(!best||p.o.z>best.o.z)best=p}}return best&&best.o},

  if(a){this.press={a,x:p.x,y:p.y,t:performance.now(),mode:null,lx:p.x,ly:p.y,id:e.pointerId};this.press.timer=setTimeout(()=>{if(this.press&&!this.press.mode){this.press.mode='hold';OC.Play.pick(a);Cam.focus=a;OC.UI&&OC.UI.select(a)}},430);return}
  this.drag={x:p.x,y:p.y,sx:p.x,sy:p.y,t:performance.now(),moved:0,w0:R.cam.unproject(p.x,p.y),tx:Cam.goal.tx,tz:Cam.goal.tz};Cam.vel.x=Cam.vel.z=0},
 move(e){if(!this.ptrs.has(e.pointerId))return;const p=this.pos(e);const prev=this.ptrs.get(e.pointerId);this.ptrs.set(e.pointerId,p);
  if(this.pinch&&this.ptrs.size>=2){const [a,b]=[...this.ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);Cam.goal.D=this.pinch.D*this.pinch.d/Math.max(20,d);return}
  if(OC.UI&&OC.UI.placing){OC.UI.placing.move(p);return}
  const P=this.press;if(P&&P.id===e.pointerId){const dx=p.x-P.x,dy=p.y-P.y;
   if(!P.mode&&Math.hypot(dx,dy)>9){clearTimeout(P.timer);P.mode='pet';OC.Play.petStart(P.a);Cam.focus=P.a;OC.UI&&OC.UI.select(P.a,true)}
   if(P.mode==='pet'){OC.Play.petMove(P.a,p.y-P.ly,p.x-P.lx);P.lx=p.x;P.ly=p.y;e.preventDefault()}
   else if(P.mode==='hold'){const w=R.cam.unproject(p.x,p.y+R.cam.p(P.a.x,0,P.a.z).s*.5);P.a.x=w.x;P.a.z=w.z;P.a.y=.45+Math.sin(performance.now()/180)*.03;P.a.facing=(p.x-prev.x)>1?1:(p.x-prev.x)<-1?-1:P.a.facing;e.preventDefault()}return}
  const D=this.drag;if(D){D.moved=Math.max(D.moved,Math.hypot(p.x-D.sx,p.y-D.sy));if(D.moved<6)return;const w=R.cam.unproject(p.x,p.y);const dx=w.x-D.w0.x,dz=w.z-D.w0.z;
   Cam.goal.tx-=dx;Cam.goal.tz-=dz;R.cam.tx=Cam.goal.tx;R.cam.tz=Cam.goal.tz;const now=performance.now(),dt=Math.max(1,now-D.t)/1000;Cam.vel.x=-dx/dt*.6;Cam.vel.z=-dz/dt*.6;D.t=now;D.w0=R.cam.unproject(p.x,p.y);Cam.follow=false;if(D.moved>40)U.emit('tut','pan');OC.UI&&OC.UI.followChanged&&OC.UI.followChanged()}},
 cancelPress(){if(this.press){clearTimeout(this.press.timer);if(this.press.mode==='pet')OC.Play.petEnd(this.press.a);if(this.press.mode==='hold'){const a=this.press.a;OC.Play.drop(a,a.x,a.z)}this.press=null}},
 up(e,cancel){if(!this.ptrs.has(e.pointerId))return;const p=this.ptrs.get(e.pointerId);this.ptrs.delete(e.pointerId);if(this.ptrs.size<2)this.pinch=null;
  if(OC.UI&&OC.UI.placing){OC.UI.placing.up(p);return}
  const P=this.press;if(P&&P.id===e.pointerId){clearTimeout(P.timer);if(!P.mode&&!cancel){Cam.focus=P.a;Cam.follow=true;OC.UI&&OC.UI.select(P.a);OC.UI&&OC.UI.actorTap(P.a)}else this.cancelPress();this.press=null;return}
  const D=this.drag;if(D){this.drag=null;if(D.moved<6&&!cancel&&performance.now()-D.t<500){const o=this.hitObj(p.x,p.y);if(o)OC.UI&&OC.UI.objTap(o);else{const now=performance.now();if(this.lastTap&&now-this.lastTap<330){const w=R.cam.unproject(p.x,p.y);const a=Sim.active();if(a&&a.loc===R.sc.id)OC.Play.call(a,w.x,w.z)}this.lastTap=now}}}}};

/* ---------- 地點切換（含柔和轉場） ---------- */
const World={go(id,{instant,focus}={}){const C=OC.Content;if(!C.LOC[id])return;OC.S.world.loc=id;if(OC.Pages&&OC.Pages.cur)OC.Pages.close();
  const doIt=()=>{R.setScene(id);Sim.refreshActors();const sc=R.sc;const a=focus||[...R.actors].find(x=>x.id===OC.S.activeId)||R.actors[0];Cam.focus=a||null;Cam.follow=!!a;
   if(a&&sc.kind!=='room')Cam.set(a.x,a.z+.5,sc.cam.D,true);else Cam.set(sc.cam.tx,sc.cam.tz,sc.kind==='room'?sc.cam.D:19,true);OC.Quests.on('loc:'+id);U.emit('scene',id);U.emit('tut',id==='house'?'house':'map');OC.Store.save()};
  if(instant||!OC.UI){doIt();return}OC.UI.fade(doIt)}};

/* ---------- 前景／背景：背景時停止繪製、只在回來時補算 ---------- */
document.addEventListener('visibilitychange',()=>{if(document.hidden){OC.Store.flush();Loop.stop();Loop.hiddenAt=Date.now()}else{const away=(Date.now()-(Loop.hiddenAt||Date.now()))/1000;if(away>60){const r=Sim.offline(away);if(r&&r.lines.length&&OC.UI)OC.UI.welcomeBack(r)}Loop.start();OC.Native&&OC.Native.pullPetEvents&&OC.Native.pullPetEvents()}});
window.addEventListener('pagehide',()=>OC.Store.flush());
window.addEventListener('resize',()=>{R.resize()});

/* ---------- 啟動 ---------- */
async function boot(){const S=OC.Store.load();OC.Pages.applyTheme();OC.Pages.init();
 /* 舊存檔處理：若沒有 v4 存檔但有 3.2 存檔 → 自動匯入（不覆蓋、不刪除舊資料） */
 let migrated=0;if(OC.Store.isNew()&&OC.Store.hasLegacy()){try{migrated=await OC.Store.importLegacy();S.flags.introSeen=true;S.flags.started=true;S.flags.tutorialDone=true}catch(e){console.error('legacy',e)}}
 for(const c of S.chars)OC.Chars.ensure(c);
 if(!S.activeId&&S.chars[0])S.activeId=S.chars[0].id;
 OC.Scenes.syncHouse();OC.Scenes.syncFurn();
 Env.update();R.init(OC.U.$('#world'));Input.init(OC.U.$('#world'));
 const loc=S.flags.started?S.world.loc:'home';R.setScene(OC.Content.LOC[loc]?loc:'home');
 Sim.init();
 if(S.flags.started){const away=(Date.now()-(S.lastSeen||Date.now()))/1000;const r=Sim.offline(away);OC.Quests.ensure();World.go(R.sc.id,{instant:true});OC.UI.init();if(r&&r.lines.length)setTimeout(()=>OC.UI.welcomeBack(r),900);
  if(migrated)setTimeout(()=>OC.UI.toast(`已從 3.2 版匯入 ${migrated} 位夥伴與存檔`,'check'),600);
  if(!S.flags.houseChosen)setTimeout(()=>OC.Intro.houseOnly(),1400)}
 else{OC.UI.init();OC.Intro.start()}
 Loop.start();OC.Native&&OC.Native.init&&OC.Native.init();
 const sp=OC.U.$('#splash');if(sp){sp.classList.add('out');setTimeout(()=>sp.remove(),600)}}
OC.Loop=Loop;OC.Cam=Cam;OC.Input=Input;OC.World=World;OC.boot=boot;
})(window.OC);

</script>
<script>
window.addEventListener('error',e=>{console.error('[oc]',e.message)});
OC.boot().catch(e=>{console.error(e);var s=document.getElementById('splash');if(s)s.innerHTML='<b style="font-size:15px;letter-spacing:0">啟動失敗：'+String(e&&e.message||e)+'</b>'});
</script>
</body>
</html>
