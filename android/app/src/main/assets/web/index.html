:root{--bg:#F7F3EC;--panel:#FFFFFF;--panel-a:rgba(255,255,255,.9);--panel2:#F5F1EA;--panel3:#EEF2FF;--ink:#4A3B36;--ink2:#8A7B74;--ink3:#B4A8A0;--line:rgba(110,80,60,.1);

.choice{position:absolute;left:50%;bottom:calc(16% + var(--safe-b));z-index:16;display:flex;flex-direction:column;gap:10px;transform:translate(-50%,20px);opacity:0;transition:.3s cubic-bezier(.2,1.2,.4,1)}.choice.in{transform:translate(-50%,0);opacity:1}
.choice button{min-width:220px;padding:13px 22px;border-radius:22px;background:var(--panel);box-shadow:var(--sh2);font-weight:800;font-size:15px}.choice button:active{background:var(--acc-bg)}
/* ================= 拍照 ================= */
.photo-ui{position:absolute;inset:0;z-index:25;pointer-events:none}.photo-ui>*{pointer-events:auto}.ph-frame{position:absolute;inset:14px;border:2px solid rgba(255,255,255,.7);border-radius:26px;pointer-events:none}
.ph-top{position:absolute;left:0;right:0;top:calc(24px + var(--safe-t));display:flex;justify-content:space-between;align-items:center;padding:0 24px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.ph-bot{position:absolute;left:0;right:0;bottom:calc(30px + var(--safe-b));display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 20px}
.shutter{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.4);display:grid;place-items:center;box-shadow:0 4px 20px rgba(0,0,0,.2)}.shutter i{width:58px;height:58px;border-radius:50%;background:#fff;transition:transform .1s}.shutter:active i{transform:scale(.88)}
.ph-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.ph-flash.go{animation:flash .45s ease-out}@keyframes flash{0%{opacity:.9}100%{opacity:0}}.ph-prev{width:100%;border-radius:20px;display:block}
/* ================= 開場 ================= */
#intro{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;transition:opacity .4s}#intro.on,#intro.place{opacity:1;pointer-events:auto}#intro.place{pointer-events:none}#intro.place>*{pointer-events:auto}
#intro.dim{pointer-events:none!important}#intro.dim .in-card{opacity:0;pointer-events:none}
.in-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(transparent 30%,rgba(247,243,236,.55) 72%);transition:opacity .5s,transform .6s}.in-title.out{opacity:0;transform:scale(1.05);pointer-events:none}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.9;color:#fff;text-shadow:0 3px 0 rgba(90,120,140,.35),0 8px 24px rgba(60,90,120,.35);animation:float 4s ease-in-out infinite}.logo b{font-size:64px;letter-spacing:.06em}.logo span{font-size:38px;font-weight:900;letter-spacing:.08em}
.in-title p{margin:6px 0 18px;color:#5B6E7E;font-weight:900;letter-spacing:.2em;font-size:15px}@keyframes float{50%{transform:translateY(-6px)}}
.in-cap{position:absolute;left:0;right:0;bottom:16%;display:flex;flex-direction:column;align-items:center;padding:0 28px}
.in-cap p{white-space:pre-line;text-align:center;font-size:19px;font-weight:900;color:#fff;text-shadow:0 2px 10px rgba(30,40,60,.55);opacity:0;transform:translateY(10px);transition:opacity .6s,transform .8s cubic-bezier(.2,.9,.3,1);min-height:3em}.in-cap p.in{opacity:1;transform:none}
.in-ctl{display:flex;gap:16px;margin-top:10px}.in-ctl .link{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.in-card{position:absolute;left:50%;bottom:calc(16px + var(--safe-b));transform:translateX(-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;padding:20px 18px 14px;border-radius:30px;background:var(--panel);box-shadow:var(--sh2);animation:up .5s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translate(-50%,30px);opacity:0}}.in-card h2{margin:0 0 4px;font-size:22px}
.demo-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.demo{position:relative;display:flex;flex-direction:column;align-items:center;padding:10px 6px;border-radius:22px;background:var(--panel2);border:2.5px solid transparent;text-align:center}.demo b{font-size:13px}.demo small{font-size:10.5px;color:var(--ink2)}
.demo i{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.5);transition:.2s}.demo.on{border-color:var(--acc);background:var(--acc-bg)}.demo.on i{opacity:1;transform:none}
.pl-tip{position:absolute;left:50%;top:calc(20px + var(--safe-t));transform:translateX(-50%);padding:10px 20px;border-radius:22px;background:var(--panel);box-shadow:var(--sh2);text-align:center}.pl-tip b{display:block}.pl-tip small{color:var(--ink2);font-size:12px}
.pl-bar{position:absolute;left:0;right:0;bottom:calc(24px + var(--safe-b));display:flex;justify-content:center;gap:10px}
#coach{position:fixed;inset:0;z-index:45;pointer-events:none}.co-c{position:absolute;left:12px;bottom:calc(178px + var(--safe-b));width:min(330px,calc(100vw - 90px));padding:14px 16px 8px;border-radius:24px;background:var(--panel);box-shadow:var(--sh2);pointer-events:auto;opacity:0;animation:cin .45s .1s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes cin{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}.co-c small{color:var(--acc);font-weight:900;font-size:11px}.co-c b{display:block;font-size:15px;margin:1px 0}.co-c p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.45}.co-c .row.end{margin-top:2px}
.co-ring{position:absolute;left:0;top:0;border-radius:24px;border:3px solid #FFD36E;box-shadow:0 0 0 4px rgba(255,211,110,.3);transition:transform .25s,width .25s,height .25s;animation:cring 1.6s ease-in-out infinite;pointer-events:none}@keyframes cring{50%{box-shadow:0 0 0 10px rgba(255,211,110,.12)}}
#fileIn{display:none}
/* 角色 SVG 預設只顯示一般表情 */
.oc-svg .eye-c,.oc-svg .eye-h,.oc-svg .mouth-h,.oc-svg .mouth-o,.toy-svg .eye-extra,.toy-svg .mouth-extra{display:none}
:root[data-motion=reduce] *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.08s!important}
@media (max-height:700px){.hud-rail{gap:8px}.sq{width:50px;height:50px;border-radius:17px}.hud-loc{display:none}}
@media (min-width:760px){.tray{left:14px;right:auto;width:520px}}

</style>
</head>
<body>

  <canvas id="world" aria-label="小島"></canvas>
  <div id="hud"></div>

  <main id="page" class="page"></main>

</div>
<input type="file" id="fileIn">
<script data-src="core/util.js">
/* OC Shimeji v4 · 共用工具 */
(function(OC){'use strict';
const U={};
U.$=(s,r=document)=>r.querySelector(s);
U.$$=(s,r=document)=>[...r.querySelectorAll(s)];
U.clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
U.lerp=(a,b,t)=>a+(b-a)*t;
U.rnd=(a,b)=>a+Math.random()*(b-a);
U.rint=(a,b)=>Math.floor(U.rnd(a,b+1));
U.pick=a=>a[Math.floor(Math.random()*a.length)];
U.chance=p=>Math.random()<p;
U.uid=(p='id')=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
U.esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
U.el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
U.weighted=list=>{let s=0;for(const x of list)s+=Math.max(0,x.w);if(s<=0)return null;let r=Math.random()*s;for(const x of list){r-=Math.max(0,x.w);if(r<=0)return x}return list[list.length-1]};
/* 緩動 */
U.ease={
 inOut:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
 out:t=>1-Math.pow(1-t,3),
 in:t=>t*t*t,
 smooth:t=>t*t*(3-2*t),
 back:t=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
 elastic:t=>t===0||t===1?t:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI)/3)+1
};
/* 臨界阻尼彈簧：x 追向目標，v 為速度；自然的慣性與收尾 */
U.spring=(st,target,dt,k=180,z=.75)=>{const c=2*z*Math.sqrt(k);const a=k*(target-st.x)-c*st.v;st.v+=a*dt;st.x+=st.v*dt;return st.x};
U.approach=(v,t,rate,dt)=>v+(t-v)*(1-Math.exp(-rate*dt));
/* 可重現亂數（地形、植物分佈固定，不會每次重載都不一樣） */
U.rng=seed=>{let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}};
U.hash=str=>{let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
/* 1D/2D value noise */
const P=new Uint8Array(512);{const r=U.rng(1337);const a=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}for(let i=0;i<512;i++)P[i]=a[i&255]}
const fade=t=>t*t*(3-2*t);
U.noise2=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const h=(i,j)=>P[(P[(xi+i)&255]+yi+j)&255]/255;const u=fade(xf),v=fade(yf);return U.lerp(U.lerp(h(0,0),h(1,0),u),U.lerp(h(0,1),h(1,1),u),v)};
U.noise1=x=>U.noise2(x,.5);
/* 顏色 */
U.hex=h=>{h=String(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||0,parseInt(h.slice(4,6),16)||0]};
U.rgb=(a,al)=>al==null||al>=1?`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`:`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${+al.toFixed(3)})`;
U.mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
U.mulc=(a,b)=>[a[0]*b[0]/255,a[1]*b[1]/255,a[2]*b[2]/255];
U.shade=(c,k)=>k>=0?U.mixc(c,[255,255,255],k):U.mixc(c,[0,0,0],-k);
U.fmtTime=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
U.dayKey=(d=new Date())=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
U.buzz=ms=>{try{if(OC.S&&OC.S.settings.haptics===false)return;if(OC.Native&&OC.Native.has())OC.Native.vibrate(ms);else navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
/* 只有在內容改變時才寫入 DOM：避免不必要的重新排版與閃爍 */
U.setText=(n,t)=>{if(n&&n.textContent!==String(t))n.textContent=t};
U.setHTML=(n,h)=>{if(n&&n._h!==h){n._h=h;n.innerHTML=h}};
U.toggle=(n,c,on)=>{if(n&&n.classList.contains(c)!==!!on)n.classList.toggle(c,!!on)};
U.attr=(n,k,v)=>{if(n&&n.getAttribute(k)!==String(v))n.setAttribute(k,v)};
/* 小型事件匯流排 */
const subs={};
U.on=(e,f)=>{(subs[e]=subs[e]||new Set()).add(f);return()=>subs[e].delete(f)};
U.emit=(e,d)=>{const s=subs[e];if(s)for(const f of [...s]){try{f(d)}catch(err){console.error('[bus]',e,err)}}};
OC.U=U;
})(window.OC=window.OC||{});

</script>
<script data-src="art/icons.js">
/* OC Shimeji v4.1 · 原創圖標庫（全部向量手繪風，禁止使用 emoji）
   ─ UI 圖標：柔和漸層＋高光的立體小物件風格（參考舒適生活模擬遊戲）

(function(OC){'use strict';
let gid=0;

const R=(a,b)=>{const id='ir'+(++gid);return{id,def:`<radialGradient id="${id}" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient>`,url:`url(#${id})`}};

const wrap=(defs,body,vb='0 0 48 48')=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${defs?`<defs>${defs}</defs>`:''}${body}</svg>`;

D.users=()=>{const a=R('#FFE1C9','#F4B98F'),b=G('#9FC2F7','#6D96E8');return wrap(a.def+b.def,`${sh()}<path d="M9 41c0-8 6-13 15-13s15 5 15 13z" fill="${b.url}"/><circle cx="24" cy="19" r="9" fill="${a.url}"/><path d="M15 17c1-6 6-9 11-8 5 1 8 4 8 9-4-2-8-5-10-8-2 3-5 6-9 7z" fill="#7B6E86"/>`)};
D.bag=()=>{const a=G('#F3B571','#D98A42'),b=G('#FFD49A','#F0AE62');return wrap(a.def+b.def,`${sh()}<path d="M17 15v-3a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v3" fill="none" stroke="#B87436" stroke-width="3.2"/><rect x="7" y="15" width="34" height="26" rx="7" fill="${a.url}"/><rect x="7" y="15" width="34" height="11" rx="6" fill="${b.url}"/><rect x="20" y="23" width="8" height="6" rx="2" fill="#FFF4E2"/>${hl('M11 18h10a2 2 0 0 1 0 2H11z')}`)};

D.map=()=>{const a=G('#BFE6A8','#7DC27A'),w=G('#9FD7F2','#6FB8E6');return wrap(a.def+w.def,`${sh()}<rect x="6" y="11" width="36" height="29" rx="6" fill="${a.url}"/><path d="M6 31c8-2 12 3 20 1s10-5 16-3v5a6 6 0 0 1-6 6H12a6 6 0 0 1-6-6z" fill="${w.url}"/><path d="M14 22l5-6 6 7 4-4 6 8" fill="#5FA36A" opacity=".6"/><path d="M33 6c-4 0-7 3-7 7 0 5 7 11 7 11s7-6 7-11c0-4-3-7-7-7z" fill="#F0707A"/><circle cx="33" cy="13" r="2.6" fill="#fff"/>`)};
D.camera=()=>{const a=G('#B49BF0','#7F67D6');return wrap(a.def,`${sh()}<path d="M17 12l2-4h10l2 4" fill="#6A52C2"/><rect x="6" y="12" width="36" height="28" rx="8" fill="${a.url}"/><circle cx="24" cy="26" r="9" fill="#fff"/><circle cx="24" cy="26" r="6" fill="#5A4AB0"/><circle cx="22" cy="24" r="2" fill="#fff" opacity=".8"/><circle cx="35" cy="18" r="2" fill="#FFE08A"/>`)};
D.garden=()=>{const a=G('#E2B784','#C38D58'),l=G('#9ED67A','#5FAE55');return wrap(a.def+l.def,`${sh()}<rect x="8" y="26" width="32" height="15" rx="3" fill="${a.url}"/><path d="M8 31h32" stroke="#A9773F" stroke-width="1.6"/><path d="M16 26c-1-6 2-11 7-13-1 5-3 9-7 13z" fill="${l.url}"/><path d="M24 26c0-8 4-14 11-15-1 7-5 12-11 15z" fill="${l.url}"/><path d="M24 26c-2-5-7-7-11-6 2 3 6 6 11 6z" fill="#7BC46A"/>`)};
D.lantern=()=>{const g=R('#FFF6C8','#FFC65C');return wrap(g.def,`${sh()}<path d="M24 4v5" stroke="#5B4B44" stroke-width="2.4" ${ST}/><path d="M16 12h16l-2-3H18z" fill="#4E4148"/><rect x="15" y="12" width="18" height="24" rx="4" fill="#5B4D54"/><rect x="18" y="15" width="12" height="18" rx="3" fill="${g.url}"/><path d="M14 36h20l-2 4H16z" fill="#4E4148"/>`)};
D.bell=()=>{const a=G('#FFD27A','#F2A93B');return wrap(a.def,`<path d="M12 33V22a12 12 0 0 1 24 0v11l3 4H9z" fill="${a.url}"/><circle cx="24" cy="40" r="4" fill="#E08E2E"/>${hl('M16 22a8 8 0 0 1 5-7c-2 3-3 6-3 9z')}`)};
D.gear=()=>wrap('',`<path d="M24 6l3 1 1 5 4 2 4-3 3 3-3 4 2 4 5 1v4l-5 1-2 4 3 4-3 3-4-3-4 2-1 5h-4l-1-5-4-2-4 3-3-3 3-4-2-4-5-1v-4l5-1 2-4-3-4 3-3 4 3 4-2 1-5z" fill="#8E8FA8"/><circle cx="24" cy="24" r="6" fill="#fff"/>`);
D.wave=()=>{const a=G('#FFE3CC','#F6BE94');return wrap(a.def,`<path d="M15 26V13a2.5 2.5 0 0 1 5 0v10M20 22V10a2.5 2.5 0 0 1 5 0v12M25 22V12a2.5 2.5 0 0 1 5 0v12M30 24v-7a2.5 2.5 0 0 1 5 0v11c0 8-5 13-12 13-5 0-8-3-10-6l-5-8a2.5 2.5 0 0 1 4-3l3 4" fill="${a.url}" stroke="#7A5B4A" stroke-width="2.2" ${ST}/><path d="M38 8c2 2 3 4 3 7M41 5c3 3 4 6 4 10" fill="none" stroke="#F0919E" stroke-width="2" ${ST}/>`)};

  const o={app:'oc-shimeji',kind:'char',v:VER,char:ch,assets:{},creations:[]};const keys=[];if(c.img)keys.push(c.img);if(c.anim&&c.anim.frames)for(const L of Object.values(c.anim.frames))keys.push(...(L||[]));

 /* 匯入角色包：一律給新 ID、新素材鍵，不會覆蓋現有角色 */

  const pers=d=>{const sl=(d&&d.pers&&d.pers.sl)||{};return{sliders:Object.fromEntries(C.SLIDERS.map(s=>[s.k,Number.isFinite(+sl[s.k])?+sl[s.k]:50])),traits:((d&&d.pers&&d.pers.traits)||[]).filter(t=>C.TRAIT[t]).slice(0,6)}};

/* OC Shimeji v4 · 角色資料模型 */
(function(OC){'use strict';

const DEMO_SL={mochi:{lively:68,social:72,expr:80,pace:60,indep:45,friendly:75},yuzu:{lively:55,social:55,expr:55,pace:45,indep:60,friendly:85},sora:{lively:22,social:40,expr:40,pace:20,indep:35,friendly:65}};
const DEMO_PHRASE={mochi:'閃閃～',yuzu:'呢',sora:'…呼啊'};
const Chars={
 demoTraits:id=>(DEMO_TRAITS[id]||[]).slice(),

   phrase:o.phrase??(demo?DEMO_PHRASE[demo]:''),voice:o.voice||'normal',
   lockedTraits:[],declined:{},noSuggest:false,
   foodPref:o.foodPref||null,

function sanitizeProfile(p){p=p&&typeof p==='object'?p:{};const S=(v,n)=>typeof v==='string'?v.slice(0,n):'';const A=v=>Array.isArray(v)?v.filter(x=>typeof x==='string').slice(0,24):[];

const Items={

(function(OC){'use strict';

const R={cv:null,ctx:null,cam:new Camera(),sc:null,static:null,sctx:null,skey:'',actors:[],t:0,dpr:1,

   for(let x=0;x<=W;x+=8){const n=U.noise1((x+cam.tx*12*(li+1))*.006+seed);const isl=Math.max(0,n-.42)*2.2;const y=hz-isl*H*amp*2.2-Math.max(0,U.noise1(x*.02+seed*3)-.5)*H*amp*.6;g.lineTo(x,y)}g.lineTo(W,hz+1);g.closePath();g.fill()});

  for(const L of sc.land)this.drawLand(g,L);

  for(const c of [...sc.cliffs].sort((a,b)=>Math.min(...a.pts.map(p=>p[1]))-Math.min(...b.pts.map(p=>p[1]))))this.drawCliff(g,c);

  g.setTransform(1,0,0,1,0,0)},

 decide(a){const c=a.c,night=Env.isNight(),dusk=Env.phase==='dusk',hasHouse=!!(OC.S.world.house&&OC.S.world.house.placed),rainy=Env.rainy(),h=Env.h;

   /* 會照顧人的朋友會過來關心 */const helper=[...this.agents.values()].find(o=>o!==a&&o.loc===a.loc&&!o.busy()&&Chars.soc(o.c,'comfort')>1.2&&Math.hypot(o.x-a.x,o.z-a.z)<8);if(helper&&OC.Social)setTimeout(()=>{if(!helper.busy()&&!a.busy())OC.Social.start(helper,a,'comfort')},1500);setTimeout(()=>a.face=null,1600);return}

  T.t+=dt;for(const [k,v] of Object.entries(d.gain))c.needs[k]=U.clamp(c.needs[k]+v*dt*(c.health.sick&&k!=='energy'?.7:1),0,100);
  if(d.wander&&!a.goal&&Math.random()<dt*.5){const sc=scene(c.loc),p=sc.near(a.x,a.z,d.fast?3.5:2.2);a.goal={x:p.x,z:p.z,fast:d.fast};a.pose=d.fast?'run':'walk'}
  if(d.wander&&!a.goal&&a.pose!==d.pose)a.pose=d.pose==='walk'||d.pose==='run'?'look':d.pose;
  if(a.hold&&d.pose==='eat')a.holdK=1-T.t/T.dur;
  if(d.notes&&Math.random()<dt*1.2&&this.visible(a))OC.Fx.note(a.x,1.3,a.z);
  if(d.pose==='sleep'&&Math.random()<dt*.6&&this.visible(a))OC.Fx.add({k:'zz',x:a.x+.2,z:a.z,y:1.1+(a.gy||0),vy:.25,vx:.12,life:2.2,sz:.12});
  if(d.id==='sleep'&&c.quirks.sleep==='talk'&&Math.random()<dt*.03)a.say(U.pick(C.LINES.sleepTalk),{life:3});
  if(d.id==='sleep'&&c.quirks.sleep==='toss'&&Math.random()<dt*.05)a.facing*=-1;
  if(d.id==='fish'&&Math.random()<dt*.08&&this.visible(a)){OC.Fx.splash(a.x+.6*a.facing,a.z+1.1,4)}
  /* 睡覺：睡飽或天亮就起床 */
  const done=T.t>=T.dur||(d.id==='sleep'&&c.needs.energy>=97&&!Env.isNight())||(d.pose==='eat'&&c.needs.hunger>=99);
  if(done)this.finish(a,true)},
 onStart(a,T){const c=a.c,d=T.def;
  if(Math.random()<.35&&this.visible(a)){const line=this.actLine(c,d);if(line)a.say(line)}
  if(d.id==='stargaze'||d.id==='sunset')a.feel('spark',2);
  if(d.id==='sleep'||d.id==='nap')a.bubble=null},
 actLine(c,d){const T={cook:['今天來做點好吃的！','聞起來好香～'],eat:['開動了！','好好吃～'],cafe:['來杯熱可可吧。','這裡的蛋糕最好吃了！'],read:['再讀一章就好…','這本書好好看。'],garden:['快快長大喔～','今天也要澆水。'],fish:['今天會釣到什麼呢？','噓…魚要上鉤了。'],shells:['這個貝殼好漂亮！','又撿到一個～'],explore:['那邊好像有什麼…','冒險出發！'],stargaze:['今晚的星星好亮。','是流星嗎？'],sunset:['夕陽好美…','今天也辛苦了。'],campfire:['火光好溫暖。','要不要烤棉花糖？'],music:['啦啦啦～','這首歌好好聽！'],play:['來玩吧！','抓到你了！'],tidy:['打掃乾淨心情好。'],bathe:['洗香香～'],sofa:['好軟喔…不想動了。'],shop:['今天有什麼新東西呢？'],forage:['蘑菇蘑菇在哪裡～']};
  const p=T[d.id];if(p)return Chars.say(c,U.pick(p));const l=Chars.line(c,'idle');return Math.random()<.4?l:null},
 finish(a,ok){const T=a.task;if(!T)return;const c=a.c,d=T.def;a.task=null;a.gy=0;a.hold=null;a.lookAt=null;a.inside=0;a.alpha=1;a.pose='stand';
  if(ok&&T.phase==='do'&&T.t>d.dur[0]*.5){c.counters[d.id]=(c.counters[d.id]||0)+1;if(Env.isNight())c.counters._night=(c.counters._night||0)+1;
   if(d.skill)this.skill(c,d.skill,1);
   this.result(a,T);
   OC.Quests&&OC.Quests.on('act:'+d.id,c);
   for(const w of c.wishes)if(w.k==='do'&&w.act===d.id)this.fulfill(a,w)}
  if(d.then&&ok)this.start(a,Acts.ACT[d.then])},
 /* 行動結果：收穫、記憶、心情 */
 result(a,T){const c=a.c,d=T.def;const lucky=Chars.has(c,'lucky')?1.6:1;
  if(d.loot&&Math.random()<.75*lucky){const sk=(c.skills[d.skill]||0);const pool=d.loot;let id=pool[Math.min(pool.length-1,Math.floor(Math.random()*(pool.length-1+Math.min(1,sk/60)+(lucky>1?.6:0))))];
   if(id){Items.add(id,1);const it=C.ITEM[id];this.log(c,`${c.name}在${C.LOC[c.loc].t}${d.t==='釣魚'?'釣到了':'找到了'}${it.em}${it.name}`,it.rare?'star':'leaf');
    if(this.visible(a)){a.say(it.rare?`哇！是${it.name}！`:`找到${it.name}了～`);a.feel(it.rare?'spark':'note');OC.Fx.sparkle(a.x,1.2,a.z,it.rare?10:5)}
    if(it.rare)this.remember(c,'find',`找到稀有的${it.name}`,.8,[],c.loc);OC.Quests&&OC.Quests.on('loot:'+it.cat,c)}}
  if(d.id==='garden'){const G=OC.S.world.garden;const k=T.obj&&T.obj.plot;if(k!=null){const p=G[k]||(G[k]={g:0});p.g=Math.min(4,(p.g||0)+1);p.t=Date.now();if(p.g>=4&&Math.random()<.35){Items.add('flower',1);p.g=1;this.log(c,`${c.name}的花圃開花了，收成了野花`,'leaf')}OC.R.invalidate()}}
  if(d.id==='cook'&&Math.random()<.1+c.skills.cooking/400){const f=U.pick(['onigiri','soup','bread','cookie']);Items.add(f,1);this.log(c,`${c.name}做了${C.ITEM[f].em}${C.ITEM[f].name}，放進了背包`,'heart')}
  if(['stargaze','sunset'].includes(d.id)&&Math.random()<.5){const others=[...this.agents.values()].filter(o=>o!==a&&o.task&&o.task.def.id===d.id);this.remember(c,'view',d.id==='stargaze'?'看到滿天星星':'看了很美的夕陽',.6,others.map(o=>o.id),c.loc);for(const o of others){OC.Social&&OC.Social.bond(a,o,4,'一起'+d.t)}}
  if(Math.random()<.2)this.remember(c,'act',d.t,.25,[],c.loc)},
 /* ================= 旅行 ================= */
 travel(a,loc){const T=a.task,c=a.c;T.phase='leave';a.fromLoc=c.loc;
  const from=c.loc;const e=from==='house'?scene('house').spots.door:(loc==='house'?scene('home').spots.door:EXIT[from]);a.goal={x:e.x,z:e.z};
  if(from==='home'&&loc==='house'||from==='house'&&loc==='home'){T.door=1}
  if(this.visible(a)&&Math.random()<.4)a.say(Chars.say(c,U.pick([`我去${C.LOC[loc].t}一下～`,`出發去${C.LOC[loc].t}！`,'我先走囉。'])))},
 sendTo(a,loc){/* 玩家指示：帶夥伴去某地 */const T={def:{id:'go',t:'前往',gain:{},dur:[3,6],pose:'stand',loc:[loc]},loc,t:0,dur:4,phase:'go'};a.task=T;if(loc!==a.c.loc)this.travel(a,loc);else this.target(a,T)},
 /* ================= 移動（避障、互相讓路） ================= */
 move(a,dt){const sc=scene(a.loc);if(a.held||a.away||a.y>.05||a.dizzy)return;
  if(!a.goal){a.vx=U.approach(a.vx,0,10,dt);a.vz=U.approach(a.vz,0,10,dt);if(Math.abs(a.vx)<.02&&(a.pose==='walk'||a.pose==='run'))a.pose=a.task&&a.task.phase==='do'?a.pose:'stand';return}
  const c=a.c;const dx=a.goal.x-a.x,dz=a.goal.z-a.z,dist=Math.hypot(dx,dz);
  if(dist<.12){a.goal=null;a.stuck=0;return}
  const W=c.quirks.walk;let sp=(.75+Chars.sl(c,'pace')*.55)*(W==='shuffle'?.78:W==='tiptoe'?1.05:W==='bouncy'?1.05:1)*(a.goal.fast?2.3:1)*(c.health.sick?.65:1)*(Chars.has(c,'athletic')?1.12:1);
  sp=Math.min(sp,dist*3+.3);let ang=Math.atan2(dz,dx);let ok=false,nx=a.x,nz=a.z;
  const tries=[0,.45,-.45,.9,-.9,1.35,-1.35,1.8,-1.8];if(a.avoid)tries.sort((p,q)=>Math.abs(p-a.avoid*.45)-Math.abs(q-a.avoid*.45));
  for(const off of tries){const an=ang+off;const px=a.x+Math.cos(an)*sp*dt,pz=a.z+Math.sin(an)*sp*dt;if(sc.ok(px,pz,a.task&&a.task.obj)||dist<.9&&sc.walk(px,pz)){nx=px;nz=pz;ok=true;if(off)a.avoid=Math.sign(off);break}}
  /* 和其他角色保持距離；絕交中的人會互相迴避 */
  for(const o of this.agents.values()){if(o===a||o.loc!==a.loc||o.away)continue;const ex=nx-o.x,ez=nz-o.z,d2=ex*ex+ez*ez;if(OC.Social&&d2<5&&d2>1e-4&&OC.Social.rel(c.id,o.id).broken){const d=Math.sqrt(d2);nx+=ex/d*sp*dt*.6;nz+=ez/d*sp*dt*.6;continue}if(d2<.62&&d2>1e-4){const d=Math.sqrt(d2);nx+=ex/d*(.79-d)*.22;nz+=ez/d*(.79-d)*.22}}
  if(!ok||!sc.walk(nx,nz)){a.stuck+=dt;if(a.stuck>1.4){a.goal=null;a.stuck=0}return}
  a.stuck=Math.max(0,a.stuck-dt);const vx=(nx-a.x)/dt,vz=(nz-a.z)/dt;a.vx=U.approach(a.vx,vx,12,dt);a.vz=U.approach(a.vz,vz,12,dt);a.x=nx;a.z=nz;
  /* 轉向遲滯：持續往同一方向移動一小段時間才轉身，避免來回抖動翻面 */
  const want=a.vx>0?1:-1;if(Math.abs(a.vx)>.28&&want!==a.facing){a.ft=(a.ft||0)+dt;if(a.ft>.14){a.facing=want;a.ft=0}}else a.ft=0;if(a.pose!=='walk'&&a.pose!=='run')a.pose=a.goal.fast?'run':'walk';
  if(a.pose==='run'&&Math.random()<dt*3&&this.visible(a))OC.Fx.dust(a.x,a.z,1)},
 visible(a){return OC.R.sc&&OC.R.sc.id===a.loc&&!a.away},

 /* ================= 健康與生病 ================= */
 health(a,dt){const c=a.c,H=c.health,now=Date.now();
  if(H.sick){if(now>=H.until){this.recover(a,'自然痊癒');return}
   if(Math.random()<dt*.025&&this.visible(a)){const s=H.sick;if(s==='cold'){a.say(U.pick(C.LINES.sick.cold),{life:2});a.squash(.8);a.feel('sweat')}else{a.say(U.pick(C.LINES.sick[s]),{life:2.6,tone:'sad'});a.feel('sick',2)}}
   if(H.sick==='tired'&&a.task&&a.task.def.id==='sleep')H.until-=dt*1000*3;return}
  if(now<H.immune)return;const n=c.needs;let risk=0;
  let base=.03;risk+=base;if(n.hygiene<20)risk+=.6;if(n.energy<12)risk+=.8;if(Env.rainy()&&c.loc!=='house'&&!a.inside)risk+=.35;if(n.hunger<8)risk+=.4;if(c.emo.sad>.7)risk+=.5;
  if(!risk)return;if(Math.random()<risk*dt/1800){const k=n.energy<12?'tired':c.emo.sad>.7?'blue':n.hunger<8?'tummy':'cold';this.getSick(a,k)}},
 getSick(a,k){const c=a.c,S=C.SICK[k];if(c.health.sick||!S)return;if(!OC.S.settings.negEvents){return}
  c.health.sick=k;c.health.since=Date.now();c.health.until=Date.now()+S.dur*3600e3*U.rnd(.7,1.2);
  this.remember(c,'sick',`生病了（${S.t}）`,-.6,[],c.loc);this.log(c,`${c.name}${k==='blue'?'心情低落':'生病了'}：${S.t}。${S.d}`,'sick');
  OC.UI&&OC.UI.toast(`${c.name} ${S.t}了…`,'sick');this.moodOf(c);
  if(a.task&&!['sleep','nap','rest','sofa'].includes(a.task.def.id))this.finish(a,false);U.emit('sick',c)},
 heal(a,power,by){const c=a.c,H=c.health;if(!H.sick)return false;H.until-=power*3600e3*.6;if(Date.now()>=H.until||power>=2){this.recover(a,by);return true}a.feel('heart');a.say(by?'謝謝你照顧我…':'感覺好一點了…');return true},
 recover(a,by){const c=a.c,k=c.health.sick;if(!k)return;c.health.sick=null;c.health.immune=Date.now()+2*3600e3;c.needs.comfort=Math.min(100,c.needs.comfort+20);
  this.log(c,`${c.name}的${C.SICK[k].t}好了！${by?'（'+by+'）':''}`,'heart');this.remember(c,'recover','身體恢復了',.5,[],c.loc);
  if(this.visible(a)){a.say('我好了！完全恢復精神～');a.hop(2);OC.Fx.sparkle(a.x,1,a.z,8)}this.moodOf(c);U.emit('sick',c)},

 /* ================= 記憶、日誌、技能 ================= */
 remember(c,k,text,val,withIds=[],loc){c.memories.unshift({t:Date.now(),k,text,val,with:withIds,loc:loc||c.loc});
  if(c.memories.length>80){/* 保留重要（強烈情緒）的記憶 */c.memories.sort((a,b)=>Math.abs(b.val)*1e13+b.t-(Math.abs(a.val)*1e13+a.t));c.memories.length=70;c.memories.sort((a,b)=>b.t-a.t)}},
 log(c,text,ic='leaf'){OC.S.log.unshift({t:Date.now(),id:c&&c.id,text,ic});if(OC.S.log.length>240)OC.S.log.length=240;U.emit('log')},
 skill(c,k,n){const before=Math.floor((c.skills[k]||0)/20);c.skills[k]=Math.min(100,(c.skills[k]||0)+n*(Chars.has(c,'smart')?1.4:1));const after=Math.floor(c.skills[k]/20);
  if(after>before){const N={cooking:'料理',gardening:'園藝',fishing:'釣魚',reading:'閱讀',social:'社交',explore:'探索',fitness:'運動',creativity:'創意'};this.log(c,`${c.name}的${N[k]}技能升到 Lv.${after}！`,'star');OC.UI&&OC.UI.celebrate&&OC.UI.celebrate(c,`${N[k]}技能 Lv.${after}`,'技能升級');}},
 heard(a,text){/* 角色說話時，附近的人會注意 */},
 /* ================= 願望 ================= */
 wish(a){const c=a.c;c.wishes=c.wishes.filter(w=>Date.now()-w.t<40*60e3);if(c.wishes.length>=2||Math.random()<.5)return;
  const opts=[];const fav=Object.entries(c.foodPref).filter(([,v])=>v===2).map(([k])=>k);
  const foods=C.ITEMS.filter(i=>(i.cat==='food'||i.cat==='drink')&&i.tags.some(t=>fav.includes(t)));if(foods.length)opts.push({k:'eat',item:U.pick(foods).id,w:c.needs.hunger<60?2:1});
  const acts=['fish','stargaze','read','garden','cafe','explore','shells','music','campfire','picnic'].filter(x=>Chars.aiW(c,x)>1.1||Math.random()<.2);if(acts.length)opts.push({k:'do',act:U.pick(acts),w:1});
  const others=[...this.agents.values()].filter(o=>o!==a);if(others.length&&c.needs.social<70){const o=U.pick(others);const r=OC.Social&&OC.Social.rel(c.id,o.id);if(!r||!r.broken)opts.push({k:'talk',with:o.id,w:1})}
  opts.push({k:'pet',w:Chars.has(c,'clingy')?2:.6});
  const g=U.weighted(opts);if(!g)return;g.t=Date.now();g.id=U.uid('w');delete g.w;c.wishes.push(g);U.emit('wish',c)},
 wishText(c,w){if(w.k==='eat'){const it=C.ITEM[w.item];return`想吃${it.em}${it.name}`}if(w.k==='do')return`想${Acts.ACT[w.act]?.t||'玩'}`;if(w.k==='talk'){const o=OC.S.chars.find(x=>x.id===w.with);return`想跟${o?o.name:'朋友'}聊天`}if(w.k==='pet')return'想被摸摸頭';return'…'},
 fulfill(a,w){const c=a.c;c.wishes=c.wishes.filter(x=>x!==w);c.emo.joy=Math.min(1,c.emo.joy+.4);Items.coins(25);c.bond+=6;
  this.log(c,`${c.name}的願望實現了：${this.wishText(c,w)}（+25 星幣）`,'star');if(this.visible(a)){a.feel('spark',2);a.hop(2.2);OC.Fx.sparkle(a.x,1.1,a.z,10)}
  OC.UI&&OC.UI.toast(`${c.name}的願望實現了！+25 星幣`,'star');OC.Quests&&OC.Quests.on('wish',c);U.emit('wish',c)},
 checkWish(a,k,data){for(const w of [...a.c.wishes]){if(w.k===k&&(k!=='eat'||w.item===data)&&(k!=='talk'||w.with===data))this.fulfill(a,w)}},

 /* ================= 後天特質成長（需玩家同意） ================= */
 GROW:[['read',22,'bookworm','經常看書'],['garden',18,'nature','經常照顧花草'],['_night',30,'nightowl','常在夜晚活動'],['fish',18,'sealover','常去海邊釣魚'],['cook',14,'cook','常常下廚'],['explore',18,'curious','熱愛森林探險'],['tidy',16,'tidy','總是在打掃'],['stargaze',12,'stargazer','常常看星星'],['music',16,'music','常聽音樂'],['play',22,'athletic','常常跑跳玩耍'],['_chat',40,'extrovert','和大家聊了很多天'],['_comfort',8,'caring','常常安慰朋友'],['sofa',22,'lazy','老是窩在沙發'],['shells',18,'collector','熱衷撿貝殼']],
 growth(c){if(c.noSuggest||c.lockedTraits.includes('*')||c.traits.length>=8)return;if(OC.S.pending.some(p=>p.k==='trait'&&p.cid===c.id))return;
  for(const [k,n,t,why] of this.GROW){if((c.counters[k]||0)<n||c.traits.includes(t))continue;const dec=c.declined[t]||0;if(dec>Date.now())continue;if(c.traits.some(x=>C.EXCL(x,t)&&c.lockedTraits.includes(x)))continue;
   OC.S.pending.push({id:U.uid('p'),k:'trait',cid:c.id,trait:t,why,t:Date.now()});this.log(c,`${c.name}因為「${why}」，好像漸漸變得${C.TRAIT[t].t}了…`,'idea');U.emit('pending');return}},
 /* ================= 離線生活 ================= */
 offline(sec){if(sec<60)return null;const H=Math.min(sec/3600,48);const out=[];
  for(const c of OC.S.chars){if(c.onIsland===false)continue;
   for(const [k,r] of Object.entries(C.DECAY)){const floor=k==='energy'?45:35;c.needs[k]=Math.max(Math.min(c.needs[k],floor),c.needs[k]-r*H*.6)}
   /* 自己照顧自己：睡覺、吃飯（不懲罰長時間離線） */
   if(H>2){c.needs.energy=Math.max(c.needs.energy,70);c.needs.hunger=Math.max(c.needs.hunger,50)}
   if(c.health.sick&&Date.now()>c.health.until){c.health.sick=null;c.health.immune=Date.now()+3600e3}
   const n=Math.min(4,Math.floor(H*1.2));for(let i=0;i<n;i++){const opts=Acts.ACTS.filter(d=>d.loot||['read','garden','stargaze','cook','cafe'].includes(d.id));const d=U.weighted(opts.map(x=>({d:x,w:Chars.aiW(c,x.id)})))?.d;if(!d)continue;
    c.counters[d.id]=(c.counters[d.id]||0)+1;if(d.skill)this.skill(c,d.skill,1);let txt=`${c.name}${d.t}`;if(d.loot&&Math.random()<.6){const id=U.pick(d.loot);Items.add(id,1);txt+=`，帶回了${C.ITEM[id].em}${C.ITEM[id].name}`}out.push(txt)}}
  for(const t of out)this.log(null,'你不在的時候：'+t,'moon');
  if(OC.Social)OC.Social.offline(H);return{hours:H,lines:out}}};
Sim.EXIT=EXIT;Sim.Agent=Agent;
OC.Sim=Sim;
})(window.OC);

<script data-src="sim/social.js">
/* OC Shimeji v4 · 多角色社交：聊天、玩耍、安慰、送禮、吵架、道歉、絕交、和好、告白 */
(function(OC){'use strict';
const {U,Content:C,Chars,Env}=OC;
const key=(a,b)=>a<b?a+'|'+b:b+'|'+a;
const LBL={stranger:'陌生',acq:'認識',friend:'朋友',good:'好友',best:'摯友',bad:'不合',broken:'絕交',lovers:'戀人',family:'家人',rival:'競爭對手'};
const Social={LBL,
 rel(a,b){const k=key(a,b);let r=OC.S.rel[k];if(!r){r=OC.S.rel[k]={f:0,r:0,trust:20,conf:0,fam:0,mem:[],last:0,broken:false,lovers:false,tag:null,noRomance:false,greet:''}}return r},
 status(r){if(r.broken)return'broken';if(r.lovers)return'lovers';if(r.tag)return r.tag;if(r.f<=-30)return'bad';if(r.f>=70)return'best';if(r.f>=40)return'good';if(r.f>=15)return'friend';return r.fam>=3?'acq':'stranger'},

   return`<button class="nt pend" data-p="${i}"><span class="nt-i">${ic(p.k==='breakup'?'bolt':p.k==='lovers'?'heart':'sparkle',24)}</span><span><b>${esc(t)}</b><small>${esc(d)}</small></span><em>決定</em></button>`}).join('');
  const IC={leaf:'sprout',star:'star',heart:'heart',moon:'moon',sick:'cross',anger:'bolt',cloud:'cloud',idea:'sparkle',hand:'paw',gift:'gift',food:'food'};
  const logs=OC.S.log.slice(0,40).map(l=>`<div class="nt"><span class="nt-i">${ic(IC[l.ic]||'sprout',22)}</span><span><b>${esc(l.text)}</b><small>${ago(l.t)}</small></span></div>`).join('');
  const s=this.sheet(`${pend?`<h3 class="sec">等你決定</h3>${pend}`:''}<h3 class="sec">小島動態</h3>${logs||'<p class="empty">今天還很平靜</p>'}`,{title:'通知',icon:'bell'});
  s.el.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const p=P[+b.dataset.p];s.close();setTimeout(()=>this.pending(p),250)})},
 /* 待決定事件（玩家擁有最終決定權） */
 pending(p){p=p||OC.S.pending[0];if(!p)return;const byId=id=>OC.S.chars.find(c=>c.id===id);const done=()=>{OC.S.pending=OC.S.pending.filter(x=>x!==p);OC.Store.save();this.hudBell()};
  const pair=(A,B,mid)=>`<div class="pair"><span class="hav lg">${OC.Rig.avatarHTML(A)}</span><span class="vs">${ic(mid,34)}</span><span class="hav lg">${OC.Rig.avatarHTML(B)}</span></div>`;
  const ask=(html,on)=>{const s=this.dialog(`<div class="dec">${html}</div>`);OC.Rig.fillImgs(s.el);s.el.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;s.close();on(b.dataset.v)})};
  if(p.k==='trait'){const c=byId(p.cid),t=C.TRAIT[p.trait];if(!c||!t){done();return}const conflict=c.traits.filter(x=>C.EXCL(x,p.trait)).map(x=>C.TRAIT[x].t);
   ask(`<span class="hav lg">${OC.Rig.avatarHTML(c)}</span><h2 class="dl-t">${esc(c.name)}好像改變了</h2><p class="lead">因為「${esc(p.why)}」，${esc(c.name)}漸漸變得<b>${esc(t.t)}</b>（${esc(t.d)}）。</p>${conflict.length?`<p class="warn">接受後會取代：${conflict.join('、')}</p>`:''}
    <div class="col"><button class="btn primary" data-v="ok">接受新特質</button><button class="btn" data-v="later">稍後再決定</button><button class="btn ghost" data-v="no">拒絕（一段時間內不再提議）</button><button class="btn ghost" data-v="lock">鎖定目前的性格</button><button class="btn ghost" data-v="off">關閉這位夥伴的性格建議</button></div>`,v=>{
    if(v==='ok'){c.traits=c.traits.filter(x=>!C.EXCL(x,p.trait));c.traits.push(p.trait);c.traits=c.traits.slice(-8);Sim.log(c,`${c.name}有了新特質：${t.t}`,'star');this.celebrate(c,t.t,'新的性格特質');done()}
    else if(v==='later'){}else{if(v==='no')c.declined[p.trait]=Date.now()+7*864e5;if(v==='lock')c.lockedTraits=['*'];if(v==='off')c.noSuggest=true;done()}});return}
  if(p.k==='breakup'){const A=byId(p.a),B=byId(p.b);if(!A||!B){done();return}
   ask(`${pair(A,B,'bolt')}<h2 class="dl-t">${esc(A.name)}和${esc(B.name)}鬧翻了</h2><p class="lead">兩人吵得很兇，${esc(A.name)}說：「我們絕交吧！」這會讓兩人互相迴避、不再一起玩。</p>
    <div class="col"><button class="btn primary" data-v="mediate">介入調解</button><button class="btn" data-v="cool">讓他們先冷靜一下</button><button class="btn ghost danger-t" data-v="ok">讓絕交發生</button></div>`,v=>{
    if(v==='ok')OC.Social.breakUp(A.id,B.id);else if(v==='cool'){const r=OC.Social.rel(A.id,B.id);r.conf=Math.max(0,r.conf-30);Sim.log(null,`${A.name}和${B.name}各自冷靜了一下。`,'cloud')}else{const r=OC.Social.mediate(A.id,B.id);this.toast(r.ok?'調解成功！兩人和好了':'兩人還需要一點時間…',r.ok?'heart':'info')}done()});return}
  if(p.k==='lovers'){const A=byId(p.a),B=byId(p.b);if(!A||!B){done();return}
   ask(`${pair(A,B,'heart')}<h2 class="dl-t">${esc(A.name)}想向${esc(B.name)}告白</h2><p class="lead">兩人感情越來越好。要讓他們成為戀人嗎？</p>
    <div class="col"><button class="btn primary" data-v="ok">成為戀人</button><button class="btn" data-v="friend">維持好朋友</button><button class="btn ghost" data-v="never">不允許這兩位發展戀愛</button></div>`,v=>{const r=OC.Social.rel(A.id,B.id);
    if(v==='ok'){r.lovers=true;Sim.log(null,`${A.name}和${B.name}成為了戀人！`,'heart');for(const [x,y] of [[A,B],[B,A]])Sim.remember(x,'lovers',`和${y.name}成為戀人`,1,[y.id]);this.celebrate(A,`${A.name} 與 ${B.name}`,'成為戀人')}else{r.r=Math.min(r.r,40);if(v==='never')r.noRomance=true}done()});return}
  done()},
 frame(){if(this.rd)this.placeRadial();if(OC.Bag&&OC.Bag.frame)OC.Bag.frame()}};
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'剛剛';if(s<3600)return Math.floor(s/60)+' 分鐘前';if(s<86400)return Math.floor(s/3600)+' 小時前';return new Date(t).toLocaleDateString('zh-TW')}
UI.ago=ago;
OC.UI=UI;
})(window.OC);

</script>
<script data-src="ui/bag.js">
/* OC Shimeji v4.1 · 背包：快捷背包（首頁，可拖曳給角色）＋完整背包（分類、搜尋、詳細資訊、物品記憶） */
(function(OC){'use strict';
const {U,Content:C,Items,Icons}=OC;const {$,esc}=U;
const CATS=[['all','全部'],['food','食物'],['drink','飲料'],['care','照顧',['medicine','care']],['toy','玩具'],['gift','禮物'],['col','收藏',['col','fish','bug']],['seed','種子'],['furn','家具',['furn','build']],['custom','創作',null,true]];
const TRAY=[['fav','常用'],['food','食物',['food','drink']],['care','照顧',['medicine','care','toy']],['gift','禮物',['gift','col','fish','bug','custom']]];
const CAT_BG={food:'#FFE8D6',drink:'#DDF0FB',medicine:'#E4F4DA',care:'#E7F0FF',toy:'#FFE3EC',gift:'#FCE4EF',col:'#E2F6F2',fish:'#DDEFFB',bug:'#EEF5DA',seed:'#EAF4DC',furn:'#F4EADB',build:'#F4EADB',custom:'#EFE8FF'};
const get=id=>C.ITEM[id]||(OC.Creations&&OC.Creations.item(id));
const Bag={trayOpen:false,target:null,
 initTray(){const el=U.el(`<div class="tray" id="tray" hidden><div class="tr-tabs" id="trTabs"></div><div class="tr-list" id="trList"></div><button class="tr-all" id="trAll">${Icons.svg('bag',22)}<small>全部</small></button></div>`);document.getElementById('app').appendChild(el);
  $('#trTabs').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;OC.S.ui.bagTab=b.dataset.t;this.renderTray()};$('#trAll').onclick=()=>{this.closeTray();OC.Pages.open('bag')};
  $('#trList').addEventListener('pointerdown',e=>this.dragStart(e));U.on('inv',()=>{if(this.trayOpen)this.renderTray();if(OC.Pages.cur==='bag')OC.Pages.render()})},
 toggleTray(){this.trayOpen?this.closeTray():this.openTray()},
 openTray(target){this.target=target||null;this.trayOpen=true;const t=$('#tray');t.hidden=false;this.renderTray();requestAnimationFrame(()=>t.classList.add('open'));U.toggle($('#hTray'),'on',true)},
 closeTray(){if(!this.trayOpen)return;this.trayOpen=false;const t=$('#tray');t.classList.remove('open');setTimeout(()=>{if(!this.trayOpen)t.hidden=true},220);U.toggle($('#hTray'),'on',false)},
 list(cats,custom){return Object.entries(OC.S.inv).filter(([id,q])=>q>0&&get(id)).map(([id,q])=>Object.assign({q},get(id))).filter(i=>custom?i.custom:(!cats||cats.includes(i.cat)))},
 renderTray(){const S=OC.S.ui;const tab=S.bagTab||'fav';U.setHTML($('#trTabs'),TRAY.map(([k,t])=>`<button data-t="${k}" class="${tab===k?'on':''}">${t}</button>`).join(''));
  let L;if(tab==='fav'){const pins=S.pins||[];L=this.list(['food','drink','medicine','care','toy','gift','custom']).sort((a,b)=>(pins.includes(b.id)-pins.includes(a.id))||(b.q-a.q)).slice(0,14)}else L=this.list(TRAY.find(t=>t[0]===tab)[2]);
  U.setHTML($('#trList'),L.length?L.map(i=>`<button class="ti ${(S.pins||[]).includes(i.id)?'pin':''}" data-id="${i.id}" style="--bg:${CAT_BG[i.cat]||'#F4EEE6'}">${Icons.item(i,34)}<b>${i.q}</b></button>`).join(''):'<p class="tr-e">這裡空空的・去商店逛逛吧</p>')},
 /* 拖曳物品給角色；點一下直接給目前的夥伴；長按加入／移除常用 */
 dragStart(e){const b=e.target.closest('.ti');if(!b)return;e.preventDefault();const id=b.dataset.id,it=get(id);const g=$('#dghost');let over=null,moved=false,lp=false;const sx=e.clientX,sy=e.clientY;
  const lpT=setTimeout(()=>{if(moved)return;lp=true;const P=OC.S.ui.pins=OC.S.ui.pins||[];const i=P.indexOf(id);if(i>=0)P.splice(i,1);else P.push(id);U.buzz(15);OC.UI.toast(i>=0?'已從常用移除':'已加入常用','check');this.renderTray();OC.Store.save()},520);
  const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){moved=true;clearTimeout(lpT);g.innerHTML=Icons.item(it,48);g.classList.add('on')}if(!moved)return;
   g.style.transform=`translate(${ev.clientX-26}px,${ev.clientY-56}px) scale(1.1)`;const r=$('#world').getBoundingClientRect();const a=OC.Input.hitActor(ev.clientX-r.left,ev.clientY-r.top,24);if(over&&over!==a)over.focus=false;over=a;if(a){a.focus=true;a.nameT=1;a.lookAt=0}U.toggle(g,'hot',!!a)};
  const up=()=>{clearTimeout(lpT);window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);g.classList.remove('on','hot');if(lp)return;
   if(moved){if(over){over.focus=false;if(OC.Play.give(over,id)){U.buzz(12);this.closeTray()}}}
   else{const a=this.target&&this.target.loc===OC.R.sc.id?this.target:OC.Sim.active();if(a&&a.loc===OC.R.sc.id){if(OC.Play.give(a,id)){U.buzz(12);this.closeTray()}}else OC.UI.toast('拖到夥伴身上就能使用','info')}};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)},
 frame(){},
 /* ================= 完整背包頁 ================= */
 page(){const S=OC.S.ui;const cat=this.cat||'all',q=(this.q||'').trim();const def=CATS.find(c=>c[0]===cat)||CATS[0];
  let L=this.list(cat==='all'?null:(def[2]||[cat]),def[3]);if(q)L=L.filter(i=>i.name.includes(q)||(i.tags||[]).some(t=>(C.TASTES.find(x=>x[0]===t)||[])[1]===q));
  const total=Object.values(OC.S.inv).reduce((a,b)=>a+b,0);
  return`<header class="ph"><span class="ph-i">${Icons.svg('bag',40)}</span><div><h1>背包</h1><p>${total} 件物品 · ${Icons.svg('coin',16)} ${OC.S.coins.toLocaleString()}</p></div></header>
   <label class="search">${Icons.svg('search',18)}<input id="bagQ" placeholder="搜尋物品或口味（例如：甜）" value="${esc(q)}"></label>
   <div class="chips sc">${CATS.map(([k,t])=>`<button class="chip ${cat===k?'on':''}" data-bc="${k}">${t}</button>`).join('')}</div>
   <div class="bag-g">${L.length?L.map(i=>`<button class="bi" data-bi="${i.id}"><span class="bi-ic" style="--bg:${CAT_BG[i.cat]||'#F4EEE6'}">${Icons.item(i,44)}</span><b>${esc(i.name)}</b><em>×${i.q}</em>${(S.pins||[]).includes(i.id)?`<i class="bi-pin">${Icons.svg('star',14)}</i>`:''}</button>`).join(''):'<p class="empty">沒有符合的物品</p>'}</div>`},
 bindPage(pg){const qi=$('#bagQ',pg);if(qi){qi.oninput=()=>{this.q=qi.value;clearTimeout(this._qt);this._qt=setTimeout(()=>{const pos=qi.selectionStart;OC.Pages.render();const n=$('#bagQ');n.focus();n.setSelectionRange(pos,pos)},250)}}},
 click(t){if(t.dataset.bc){this.cat=t.dataset.bc;OC.Pages.render();return true}if(t.dataset.bi){this.detail(t.dataset.bi);return true}return false},
 /* 物品詳細：效果、口味、誰喜歡（物品記憶）、使用／送給／常用／賣出／擺放 */
 detail(id){const it=get(id);if(!it)return;const q=Items.qty(id);const pins=OC.S.ui.pins=OC.S.ui.pins||[];
  const tags=(it.tags||[]).map(t=>(C.TASTES.find(x=>x[0]===t)||[])[1]).filter(Boolean);const FX={hunger:'飽足',energy:'精力',fun:'娛樂',social:'社交',hygiene:'清潔',comfort:'舒適'};
  const fx=Object.entries(it.fx||{}).map(([k,v])=>`<div class="nb"><span>${FX[k]||k} ${v>0?'+':''}${v}</span><i><b style="width:${Math.min(100,Math.abs(v))}%;background:${v>0?'#8CC3A0':'#E57B72'}"></b></i></div>`).join('');
  const mem=OC.S.chars.map(c=>{const v=(c.foodSeen||{})[id];if(v==null)return'';const P=C.PREF.find(p=>p[0]===v);return`<span class="pf" style="--c:${P[2]}"><span class="hav xs">${OC.Rig.avatarHTML(c)}</span>${esc(c.name)}<b>${P[1]}</b></span>`}).join('');
  const usable=['food','drink','medicine','care','toy','gift','col','fish','bug','custom'].includes(it.cat);const place=it.cat==='furn'||it.cat==='build';
  const s=OC.UI.sheet(`<div class="it-h"><span class="it-big" style="--bg:${CAT_BG[it.cat]||'#F4EEE6'}">${Icons.item(it,84)}</span><div><h2 class="dl-t">${esc(it.name)}</h2><p><em class="cat">${C.CATNAME[it.cat]||'創作'}</em> 擁有 ${q}</p>${tags.length?`<div class="trs">${tags.map(t=>`<span class="tr">${t}</span>`).join('')}</div>`:''}</div></div>
   ${it.desc?`<p class="lead">${esc(it.desc)}</p>`:''}${fx?`<h3 class="sec">效果</h3><div class="nbs">${fx}</div>`:''}${mem?`<h3 class="sec">夥伴的感想</h3><div class="pfs">${mem}</div>`:''}
   <div class="it-act">${usable?`<button class="btn primary" data-a="use">${Icons.svg('gift',20)}給夥伴</button>`:''}${place?`<button class="btn primary" data-a="place">${Icons.svg('hammer',20)}擺放</button>`:''}
    <button class="btn" data-a="pin">${Icons.svg('star',20)}${pins.includes(id)?'移出常用':'加入常用'}</button>${it.sell?`<button class="btn ghost" data-a="sell">${Icons.svg('coin',18)}賣出 ${it.sell}</button>`:''}</div>`,{cls:'it-s'});OC.Rig.fillImgs(s.el);
  s.el.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
   if(a==='pin'){const i=pins.indexOf(id);if(i>=0)pins.splice(i,1);else pins.push(id);OC.Store.save();b.innerHTML=`${OC.Icons.svg('star',20)}${pins.includes(id)?'移出常用':'加入常用'}`;if(OC.Pages.cur==='bag')OC.Pages.render()}
   else if(a==='sell'){if(OC.Shop.sell(id)){OC.UI.toast(`賣出 +${it.sell} 星幣`,'coin');s.close();if(Items.qty(id))this.detail(id);OC.Pages.render()}}
   else if(a==='place'){s.close();OC.Pages.close();OC.Deco.placeItem(id)}
   else if(a==='use'){s.close();this.chooseChar(ch=>{OC.Pages.close();setTimeout(()=>{const ag=OC.Sim.get(ch.id);if(!ag)return;if(ag.loc!==OC.R.sc.id)OC.World.go(ag.loc,{focus:ag});setTimeout(()=>OC.Play.give(ag,id),ag.loc!==OC.R.sc.id?700:200)},250)})}})},
 chooseChar(on){const L=[...OC.Sim.agents.values()];if(L.length===1){on(L[0].c);return}
  OC.UI.menu(`<h2 class="dl-t">要給誰？</h2><div class="am-g">${L.map(a=>`<button data-m="${a.id}"><span class="hav">${OC.Rig.avatarHTML(a.c)}</span><span>${esc(a.c.name)}</span></button>`).join('')}</div>`,id=>on(OC.S.chars.find(c=>c.id===id)))}};
Bag.CAT_BG=CAT_BG;
OC.Bag=Bag;
})(window.OC);

</script>
<script data-src="ui/shop.js">
/* OC Shimeji v4.1 · 商店介面：分店頁籤、店員招呼、今日精選、商品卡、數量、購買飛入背包動畫、回收 */
(function(OC){'use strict';
const {U,Content:C,Icons}=OC;const {$,esc}=U;
const ShopUI={cur:'general',
 page(tab){if(tab)this.cur=tab;const k=this.cur;const SH=OC.Shop.SHOPS;
  const tabs=Object.entries(SH).map(([id,s])=>`<button class="shop-t ${id===k?'on':''}" data-st="${id}" style="--c:${s.c};--bg:${s.bg}">${Icons.svg(s.ic,30)}<b>${s.t}</b></button>`).join('')+`<button class="shop-t ${k==='sell'?'on':''}" data-st="sell" style="--c:#B48C55;--bg:#F6EEDC">${Icons.svg('coin',30)}<b>回收</b></button>`;

   <div class="shop-g">${L.length?L.map(i=>`<div class="pc"><span class="pc-i">${Icons.item(i,52)}</span><b>${esc(i.name)}</b><small>擁有 ${i.q}</small><div class="pc-row"><button class="btn sm" data-sell="${i.id}">賣 1 個 · ${i.sell}</button>${i.q>1?`<button class="btn sm ghost" data-sellall="${i.id}">全部</button>`:''}</div></div>`).join(''):'<p class="empty">還沒有可以回收的東西。去海灘或森林找找吧！</p>'}</div>`}
  else{const S=SH[k],st=OC.Shop.stock(k);const items=st.items.map(id=>OC.Shop.item(id)).filter(Boolean);const feat=st.sale&&OC.Shop.item(st.sale);
   body=`<div class="shop-b" style="--c:${S.c};--bg:${S.bg}"><span class="shop-k">${Icons.svg(S.ic,44)}</span><div><b>${S.t}</b><p>「${esc(S.hi)}」</p></div></div>
    ${feat?`<button class="feat" data-pi="${feat.id}" style="--c:${S.c};--bg:${S.bg}"><span class="ft-i">${Icons.item(feat,72)}</span><span><small>今日精選・7 折</small><b>${esc(feat.name)}</b><em><s>${feat.price}</s> ${Icons.svg('coin',16)} ${OC.Shop.price(k,feat.id)}</em></span></button>`:''}
    <div class="shop-g">${items.length?items.map(it=>{const p=OC.Shop.price(k,it.id),q=OC.Items.qty(it.id);return`<button class="pc" data-pi="${it.id}"><span class="pc-i" style="--bg:${OC.Bag.CAT_BG[it.cat]||'#F4EEE6'}">${Icons.item(it,52)}</span><b>${esc(it.name)}</b><small>${esc(it.desc||C.CATNAME[it.cat]||'')}</small><em class="price">${Icons.svg('coin',15)} ${p}</em>${st.sale===it.id?'<i class="sale">特價</i>':''}${q?`<i class="own">${q}</i>`:''}</button>`}).join(''):(S.creations?`<p class="empty">市集還沒有作品。<br>到「工坊」創作物品、家具或建築，就會在這裡上架。</p><button class="btn primary wide" data-ws>${Icons.svg('palette',20)}前往工坊</button>`:'<p class="empty">今天賣完了</p>')}</div>
    <p class="hint">商品每天更換。${S.creations?'作品需要用星幣購買才會進入背包。':''}</p>`}
  return`<header class="ph"><span class="ph-i">${Icons.svg('shop',40)}</span><div><h1>商店街</h1><p>${Icons.svg('coin',16)} <b id="shopCoin">${OC.S.coins.toLocaleString()}</b> 星幣</p></div></header><div class="shop-tabs">${tabs}</div>${body}`},
 click(t){if(t.dataset.st){this.cur=t.dataset.st;OC.Pages.render();return true}

 detail(id){const k=this.cur,it=OC.Shop.item(id);if(!it)return;let n=1;const unit=OC.Shop.price(k,id);const tags=(it.tags||[]).map(t=>(C.TASTES.find(x=>x[0]===t)||[])[1]).filter(Boolean);

   ${it.desc?`<p class="lead">${esc(it.desc)}</p>`:''}<div class="qty"><button class="rb" data-q="-1">${Icons.svg('minus',20)}</button><b>${n}</b><button class="rb" data-q="1">${Icons.svg('plus',20)}</button></div>
   <button class="btn primary wide big" data-buy ${OC.S.coins<unit*n?'disabled':''}>${Icons.svg('coin',20)} ${unit*n} 購買</button><p class="hint" style="text-align:center">擁有 ${OC.Items.qty(id)}・持有星幣 ${OC.S.coins}</p>`;
  const s=OC.UI.sheet(draw(),{cls:'it-s'});s.el.addEventListener('click',e=>{const b=e.target.closest('[data-q],[data-buy]');if(!b)return;
   if(b.dataset.q){n=U.clamp(n+ +b.dataset.q,1,20);s.body.innerHTML=draw();return}
   if(OC.Shop.buy(k,id,n)){U.buzz(12);this.fly(b,id);OC.UI.toast(`買了 ${it.name} ×${n}`,'check');s.close();OC.Pages.render()}})},
 /* 購買動畫：物品沿弧線飛進背包按鈕 */
 fly(from,id){try{const r=from.getBoundingClientRect(),dst=document.querySelector('#nav [data-p=bag]')||document.querySelector('#hTray');const d=dst.getBoundingClientRect();const it=OC.Shop.item(id);
  const f=U.el(`<div class="fly">${it?Icons.item(it,40):Icons.svg(id,40)}</div>`);document.body.appendChild(f);const x0=r.left+r.width/2-20,y0=r.top+r.height/2-20,x1=d.left+d.width/2-20,y1=d.top+d.height/2-20;
  f.animate([{transform:`translate(${x0}px,${y0}px) scale(.6)`,opacity:0},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-90}px) scale(1.2)`,opacity:1,offset:.45},{transform:`translate(${x1}px,${y1}px) scale(.4)`,opacity:.3}],{duration:720,easing:'cubic-bezier(.3,.7,.4,1)'}).onfinish=()=>{f.remove();dst.animate([{transform:'scale(1)'},{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:300})}}catch(e){}}};
OC.ShopUI=ShopUI;
})(window.OC);

</script>
<script data-src="ui/pages.js">
/* OC Shimeji v4 · 頁面：角色（卡片、檔案、編輯器）、地圖、小島日常（任務、商店、圖鑑、故事、家具）、設定 */
(function(OC){'use strict';
const {U,Content:C,Chars,Items,Sim,Env,UI}=OC;const {$,esc}=U;const ic=UI.ic;
const NAV=[['world','小島','home'],['chars','角色','users'],['bag','背包','bag'],['life','日常','quest'],['shop','商店','shop'],['more','更多','more']];

const Pages={cur:null,CAT_IC,

 open(k,tab){const pg=$('#page');this.cur=k;if(k==='shop'){if(tab)OC.ShopUI.cur=tab}else if(k==='life')this.tab=tab||this.tab;pg.className='page on p-'+k;
  $$('#nav [data-p]').forEach(b=>U.toggle(b,'on',b.dataset.p===k||(k==='map'&&b.dataset.p==='more')));UI.closeFloating&&UI.closeFloating();UI.syncBlock();
  this.render();OC.Loop.renderOn=false;pg.scrollTop=0},
 close(){if(!this.cur)return;this.cur=null;const pg=$('#page');pg.className='page';$$('#nav [data-p]').forEach(b=>U.toggle(b,'on',b.dataset.p==='world'));OC.Loop.renderOn=true;UI.syncBlock();OC.R.skey=''},
 render(){const pg=$('#page');const k=this.cur;let h='';const y=pg.scrollTop;

 /* ================= 更多 ================= */
 more(){const T=[['map','世界地圖','map','前往不同地點'],['workshop','工坊','palette','繪畫、創作物品與動畫'],['events','自製事件','event','設計夥伴的專屬反應'],['deco','佈置','garden','家具、房子與小島擺設'],['codex','收藏圖鑑','book','發現的魚、昆蟲與收藏'],['story','生活故事','chat','島上發生的大小事'],['photo','拍照模式','camera','留下可愛的瞬間'],['settings','設定','gear','畫質、效能、資料備份']];
  return`<header class="ph"><span class="ph-i">${ic('more',40)}</span><div><h1>更多</h1><p>小島的所有功能</p></div></header><div class="hub">${T.map(([k,t,i,d])=>`<button class="hub-b" data-hub="${k}"><span>${ic(i,40)}</span><b>${t}</b><small>${d}</small></button>`).join('')}</div>`},
 hub(k){if(k==='map')this.open('map');else if(k==='workshop'){this.close();OC.Workshop.open()}else if(k==='events'){this.close();OC.Workshop.open('events')}else if(k==='deco')this.open('life','home');else if(k==='codex')this.open('life','codex');else if(k==='story')this.open('life','story');else if(k==='photo'){this.close();OC.Photo.open()}else if(k==='settings')this.settings()},
 /* ================= 角色頁 ================= */
 chars(){const list=OC.S.chars;const cards=list.map(c=>{const a=Sim.get(c.id),m=C.MOODS[c.mood]||C.MOODS.content;const st=c.onIsland===false?'休息中（不在島上）':a?(a.task?a.task.def.t:'閒晃')+' · '+C.LOC[c.loc].t:'';
   return`<article class="cc ${OC.S.activeId===c.id?'act':''}" data-cid="${c.id}"><div class="cc-art">${OC.Rig.avatarHTML(c)}</div><div class="cc-b"><b>${esc(c.name)}</b><small>${esc(Chars.sub(c))}</small>
    <div class="cc-tags"><em style="background:${m.c}">${m.t}</em>${c.health.sick?`<em class="sick">${C.SICK[c.health.sick].t}</em>`:''}${OC.S.petIds.includes(c.id)?'<em class="pet">桌寵</em>':''}${OC.S.activeId===c.id?'<em class="ctl">操控中</em>':''}</div><p>${esc(st)}</p></div>
    <div class="cc-a"><button class="chip ${c.onIsland!==false?'on':''}" data-isl="${c.id}">${c.onIsland!==false?'在島上':'加入小島'}</button><button class="chip ${OC.S.petIds.includes(c.id)?'on':''}" data-pet="${c.id}">桌寵</button></div></article>`}).join('');
  const rels=this.relSummary();
  return`<header class="ph"><span class="ph-i">${ic('users',40)}</span><div><h1>角色</h1><p>${list.length} 位夥伴 · 點卡片看完整檔案</p></div><button class="icon-btn add" data-new>${ic('plus',22)}</button></header><div class="cards">${cards}</div>

 relSummary(){const ch=OC.S.chars;const out=[];for(let i=0;i<ch.length;i++)for(let j=i+1;j<ch.length;j++){const r=OC.S.rel[ch[i].id<ch[j].id?ch[i].id+'|'+ch[j].id:ch[j].id+'|'+ch[i].id];if(!r)continue;const s=OC.Social.status(r);
  out.push(`<button class="rel s-${s}" data-rel="${ch[i].id}|${ch[j].id}"><span class="hav sm">${OC.Rig.avatarHTML(ch[i])}</span><span class="hav sm">${OC.Rig.avatarHTML(ch[j])}</span><b>${OC.Social.LBL[s]}</b><i><u style="width:${(r.f+100)/2}%"></u></i></button>`)}return out.join('')},
 relSheet(a,b){const A=OC.S.chars.find(c=>c.id===a),B=OC.S.chars.find(c=>c.id===b),r=OC.Social.rel(a,b),s=OC.Social.status(r);
  const s2=UI.sheet(`<div class="pair"><span class="hav lg">${OC.Rig.avatarHTML(A)}</span><span class="vs">${ic(s==='broken'?'bolt':'heart',34)}</span><span class="hav lg">${OC.Rig.avatarHTML(B)}</span></div><h2>${esc(A.name)} × ${esc(B.name)}</h2><p class="lead">${OC.Social.LBL[s]}</p>

   <h3 class="sec">共同回憶</h3>${r.mem.length?r.mem.slice(0,8).map(m=>`<p class="log">${ic(m.val>0?'flower':'rain',18)}<span>${esc(m.text)}</span></p>`).join(''):'<p class="empty">還沒有共同回憶</p>'}
   <h3 class="sec">關係設定</h3><div class="chips">${[['','自然發展'],['family','家人'],['rival','競爭對手']].map(([k,t])=>`<button class="chip ${(r.tag||'')===k?'on':''}" data-tag="${k}">${t}</button>`).join('')}<button class="chip ${r.noRomance?'':'on'}" data-rom>${r.noRomance?'不允許戀愛':'允許戀愛發展'}</button></div>
   ${r.broken||r.conf>30?`<button class="btn primary wide" data-med>介入調解</button>`:''}${r.lovers?`<button class="btn ghost wide" data-unlove>結束戀人關係</button>`:''}`,{});OC.Rig.fillImgs(s2.el);
  s2.el.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.tag!=null){r.tag=t.dataset.tag||null}else if(t.hasAttribute('data-rom'))r.noRomance=!r.noRomance;else if(t.hasAttribute('data-med')){const res=OC.Social.mediate(a,b);UI.toast(res.ok?'調解成功！':'還需要一點時間…',res.ok?'heart':'info')}else if(t.hasAttribute('data-unlove')){r.lovers=false;Sim.log(null,`${A.name}和${B.name}決定回到朋友關係。`,'cloud')}else return;OC.Store.save();s2.close();setTimeout(()=>this.relSheet(a,b),10);if(this.cur==='chars')this.render()})},
 /* 角色檔案（查看用） */
 profile(id){const c=OC.S.chars.find(x=>x.id===id);if(!c)return;const tp=Chars.typeName(c);const P=c.profile;
  const field=(k,v)=>v?`<div class="kv"><span>${k}</span><b>${esc(v)}</b></div>`:'';
  const traits=c.traits.map(t=>C.TRAIT[t]).filter(Boolean).map(t=>`<span class="tr" title="${esc(t.d)}">${ic(CAT_IC[t.c]||'star',16)}${esc(t.t)}</span>`).join('');
  const quirks=Object.entries(C.Q).map(([k,q])=>{const o=q.o.find(x=>x[0]===c.quirks[k]);return`<div class="kv"><span>${q.t}</span><b>${o?o[1]:'—'}</b></div>`}).join('')+(c.phrase?`<div class="kv"><span>口癖</span><b>「${esc(c.phrase)}」</b></div>`:'');

  const skills=Object.entries(c.skills).map(([k,v])=>{const N={cooking:'料理',gardening:'園藝',fishing:'釣魚',reading:'閱讀',social:'社交',explore:'探索',fitness:'運動',creativity:'創意'};return`<div class="nb"><span>${N[k]} Lv.${Math.floor(v/20)}</span><i><b style="width:${v%20*5}%;background:#9BB7E0"></b></i></div>`}).join('');
  const rels=OC.S.chars.filter(o=>o.id!==c.id).map(o=>{const r=OC.Social.rel(c.id,o.id);return`<button class="rel s-${OC.Social.status(r)}" data-rel="${c.id}|${o.id}"><span class="hav sm">${OC.Rig.avatarHTML(o)}</span><b>${esc(o.name)}</b><small>${OC.Social.label(r)}</small><i><u style="width:${(r.f+100)/2}%"></u></i></button>`}).join('');
  const mems=c.memories.slice(0,14).map(m=>`<p class="log">${ic(m.val>.3?'flower':m.val<-.3?'rain':'sprout',18)}<span>${esc(m.text)}<small>${new Date(m.t).toLocaleDateString('zh-TW')} · ${esc(C.LOC[m.loc]?.t||'')}</small></span></p>`).join('');

  const fav=Object.entries(c.counters).filter(([k])=>!k.startsWith('_')).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,n])=>`${OC.Acts.ACT[k]?.t||k}（${n} 次）`).join('、');
  const placeCnt={};for(const m of c.memories)placeCnt[m.loc]=(placeCnt[m.loc]||0)+1;const favLoc=Object.entries(placeCnt).sort((a,b)=>b[1]-a[1])[0];
  const tabs=[['base','基本'],['pers','性格'],['life','生活'],['rel','關係'],['mem','回憶']];
  const s=UI.sheet(`<div class="pf-h"><div class="pf-art">${OC.Rig.avatarHTML(c)}</div><div><h2>${esc(c.name)}</h2><p class="lead">${esc(tp[0])} · ${esc(tp[1])}</p><div class="row"><button class="btn primary" data-edit>${ic('edit')}編輯</button><button class="btn" data-act>${ic('locate')}操控</button><button class="btn ghost" data-more>${ic('more')}</button></div></div></div>

   <div class="tab" data-p="pers"><div class="sls">${C.SLIDERS.map(sl=>`<div class="sl"><span>${sl.a}</span><i><b style="left:${c.sliders[sl.k]}%"></b></i><span>${sl.b}</span></div>`).join('')}</div><h3 class="sec">特質</h3><div class="trs">${traits||'<p class="empty">尚未設定</p>'}</div><h3 class="sec">小怪癖</h3>${quirks}</div>

    <h3 class="sec">飲食喜好</h3><div class="pfs">${prefs}</div>${seen?`<h3 class="sec">吃過的東西</h3><div class="pfs">${seen}</div>`:''}<p class="hint">飲食喜好可在「編輯」中修改。</p></div>
   <div class="tab" data-p="rel"><div class="rels">${rels||'<p class="empty">島上只有自己</p>'}</div></div>
   <div class="tab" data-p="mem"><h3 class="sec">回憶</h3>${mems||'<p class="empty">還沒有回憶</p>'}<h3 class="sec">生活故事</h3>${story||'<p class="empty">故事才剛開始</p>'}</div>`,{full:true});OC.Rig.fillImgs(s.el);
  s.el.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
   if(t.dataset.tab){s.el.querySelectorAll('[data-tab]').forEach(b=>U.toggle(b,'on',b===t));s.el.querySelectorAll('.tab').forEach(p=>U.toggle(p,'on',p.dataset.p===t.dataset.tab))}

     if(m==='dup'){const n=JSON.parse(JSON.stringify(c));n.id=U.uid('c');n.name=c.name+' 2';n.memories=[];n.demo=null;OC.S.chars.push(OC.Chars.ensure(n));U.emit('chars');OC.Store.flush();UI.toast('已複製角色');s.close();this.render()}

 /* ================= 地圖 ================= */
 /* ================= 地圖 ================= */
 map(){const here=OC.R.sc.id;const pos={home:[32,60],house:[20,42],plaza:[60,34],beach:[76,72],forest:[30,18]};
  const who=id=>[...Sim.agents.values()].filter(a=>a.loc===id&&!a.away);const okLoc=id=>OC.S.world.unlocked.includes(id)&&(id!=='house'||(OC.S.world.house&&OC.S.world.house.placed));

 goWith(a){UI.menu(`<h2 class="dl-t">帶 ${esc(a.c.name)} 去哪裡？</h2><div class="am-g">${C.LOCS.filter(l=>l.id!=='house'||(OC.S.world.house&&OC.S.world.house.placed)).map(l=>`<button data-m="${l.id}">${ic(l.ic,34)}<span>${l.t}</span></button>`).join('')}</div>`,id=>{Sim.sendTo(a,id);a.say(`走吧，去${C.LOC[id].t}！`);if(id!==OC.R.sc.id)setTimeout(()=>OC.World.go(id,{focus:a}),1400)})},
 /* ================= 小島日常 ================= */
 life(){const t=this.tab||'quest';const tabs=[['quest','任務'],['codex','圖鑑'],['story','生活故事'],['home','家與佈置']];let b='';
  if(t==='quest'){const Q=OC.S.quests;const all=(Q.list||[]).length&&Q.list.every(q=>q.done);
   b=`<div class="streak">${ic('star',22)}連續生活 <b>${Q.streak||1}</b> 天${all?'　今日任務全部完成！':''}</div>`+(Q.list||[]).map((q,i)=>`<div class="qrow ${q.done?'done':''}"><span class="q-i">${ic(q.p>=q.n?'check':'quest',28)}</span><div><b>${esc(q.t)}</b><i><u style="width:${Math.min(100,q.p/q.n*100)}%"></u></i><small>${Math.min(q.p,q.n)} / ${q.n}</small></div><button class="btn sm ${q.p>=q.n&&!q.done?'primary':'ghost'}" data-claim="${i}" ${q.p>=q.n&&!q.done?'':'disabled'}>${q.done?'已領取':ic('coin',16)+' '+q.r}</button></div>`).join('')+`<p class="hint">完成全部每日任務可額外獲得 5 星鑽。</p>`}
  else if(t==='codex'){const groups=[['fish','魚類'],['bug','昆蟲'],['col','收藏'],['food','食物'],['drink','飲料'],['furn','家具']];const own=OC.S.codex;let got=0,all=0;
   b=groups.map(([k,n])=>{const L=C.ITEMS.filter(i=>i.cat===k);all+=L.length;return`<h3 class="sec">${n}</h3><div class="cx">${L.map(i=>{const o=own[i.id];if(o)got++;return`<div class="cxi ${o?'':'no'}" title="${esc(i.name)}">${o?OC.Icons.item(i,36):ic('info',30)}<small>${o?esc(i.name):'未發現'}</small></div>`}).join('')}</div>`}).join('');b=`<div class="streak">${ic('book',22)}已發現 <b>${got}</b> / ${all}</div>`+b}
  else if(t==='story'){b=OC.S.log.slice(0,80).map(l=>`<p class="log">${ic('sprout',18)}<span>${esc(l.text)}<small>${UI.ago(l.t)}</small></span></p>`).join('')||'<p class="empty">故事才剛開始</p>'}

 /* ================= 時間與天氣（就地更新，不關閉重開，避免閃爍） ================= */
 timeWeather(){const W=Env.WX;const body=()=>{const off=OC.S.world.timeOffset||0,L=Env.label();return`<p class="lead">${L.date}　<b>${L.time}</b>　${L.wx.t}</p>

  <h3 class="sec">天氣</h3><div class="chips"><button class="chip ${!OC.S.world.weather?'on':''}" data-w="">自動</button>${Object.entries(W).map(([k,v])=>`<button class="chip ${OC.S.world.weather===k?'on':''}" data-w="${k}">${ic(v.ic,18)} ${v.t}</button>`).join('')}</div><p class="hint">調整後畫面會平順過渡，夥伴的作息也會跟著改變。</p>`};
  const s=UI.sheet(body(),{title:'時間與天氣',icon:Env.WX[Env.wid].ic});
  s.el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.classList.contains('sh-x'))return;if(b.dataset.h!=null){const h=+b.dataset.h;if(!h)OC.S.world.timeOffset=0;else{const d=new Date();const cur=d.getHours()+d.getMinutes()/60;OC.S.world.timeOffset=Math.round((h-cur)*3600e3)}}
   else if(b.dataset.w!=null){OC.S.world.weather=b.dataset.w||null}else return;Env._k=-1;Env.update();UI.hudTime(true);OC.Store.save();s.update(body())})},
 /* ================= 設定（所有選項立即生效、就地更新） ================= */
 settings(){const st=OC.S.settings;const modes=[['quality','高畫質','完整光影、粒子、環境動態'],['battery','省電','30 FPS、降低特效與解析度'],['balanced','平衡','一般手機推薦'],['custom','自訂','自己調整每一項']];
  const OPTS=[['fps','FPS 上限',[[30,'30'],[60,'60']]],['scale','渲染解析度',[[1,'低'],[1.5,'中'],[2,'高'],[3,'最高']]],['shadows','地面細節與陰影',[[0,'關'],[1,'開'],[2,'高']]],['particles','粒子特效',[[0,'無'],[.3,'少'],[.6,'中'],[1,'多']]],['weather','天氣效果',[[0,'關'],[1,'開']]],['ambient','環境動畫',[[0,'關'],[1,'開'],[2,'豐富']]],['cloudShadow','雲影',[[0,'關'],[1,'開']]],['animDetail','角色動畫細節',[[0,'簡化'],[1,'標準'],[2,'精緻']]],['maxChars','同時顯示角色',[[4,'4'],[6,'6'],[10,'10'],[16,'16']]],['bgTick','畫面外角色更新',[[.25,'省電'],[.5,'一般'],[1,'即時']]]];
  const body=()=>{const cu=st.custom,sw=(k,t,d)=>`<label class="sw"><span><b>${t}</b><small>${d||''}</small></span><input type="checkbox" data-s="${k}" ${st[k]!==false?'checked':''}><i></i></label>`;return`
   <h3 class="sec">畫質與效能</h3><div class="modes">${[modes[0],modes[2],modes[1],modes[3]].map(([k,t,d])=>`<button class="mode ${st.perf===k?'on':''}" data-perf="${k}"><b>${t}</b><small>${d}</small></button>`).join('')}</div>

   <p class="hint">目前 ${OC.Loop.fps} FPS・解析度 ×${OC.R.dpr.toFixed(2)}</p>
   <div class="opt"><span>減少動態效果</span><div class="seg">${[['system','跟隨系統'],['full','完整'],['reduce','減少']].map(([v,n])=>`<button data-motion="${v}" class="${st.motion===v?'on':''}">${n}</button>`).join('')}</div></div>
   <div class="opt"><span>外觀主題</span><div class="seg">${[['system','跟隨系統'],['light','淺色'],['dark','深色']].map(([v,n])=>`<button data-theme="${v}" class="${st.theme===v?'on':''}">${n}</button>`).join('')}</div></div>
   <h3 class="sec">生活模擬</h3>${sw('autoSocial','夥伴自主社交','自己聊天、玩耍、拜訪')}${sw('negEvents','負面經歷','吵架、生病、心情低落等（重大變化仍會詢問你）')}${sw('romance','戀愛發展','成為戀人前一定會先問你')}
   <h3 class="sec">畫面</h3>${sw('bubbles','對話泡泡')}${sw('names','名字標籤')}${sw('haptics','觸覺回饋')}
   <div class="opt"><span>互動演出</span><div class="seg">${[['full','電影式'],['short','簡短']].map(([v,n])=>`<button data-cine="${v}" class="${(st.cine||'full')===v?'on':''}">${n}</button>`).join('')}</div></div>
   <h3 class="sec">Android 桌寵</h3><button class="btn wide" data-petset>${ic('paw',20)}桌寵設定</button>
   <h3 class="sec">資料與備份</h3><div class="col"><button class="btn" data-exp>${ic('export',18)}匯出完整備份（含所有圖片與動畫）</button><button class="btn" data-imp>${ic('import',18)}匯入完整備份</button><button class="btn" data-snaps>${ic('book',18)}每日自動快照與還原</button><button class="btn ghost" data-gc>清理沒有使用的素材</button>${OC.Store.hasLegacy()?'<button class="btn ghost" data-legacy>重新從 3.2 舊版匯入夥伴</button>':''}</div>
   <h3 class="sec">其他</h3><div class="col"><button class="btn" data-intro>重看開場動畫</button><button class="btn" data-tut>重看新手引導</button><button class="btn ghost danger-t" data-reset>重新開始遊戲</button></div>
   <p class="hint ver">OC Shimeji v4.2・存檔版本 ${OC.Store.VER}</p>`};
  const s=UI.sheet(body(),{full:true,title:'設定',icon:'gear'});const re=()=>s.update(body());
  s.el.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.classList.contains('sh-x'))return;
   if(b.dataset.perf){st.perf=b.dataset.perf;OC.R.resize();OC.Store.save();re()}
   else if(b.dataset.c){st.custom[b.dataset.c]=+b.dataset.v;OC.R.resize();OC.Store.save();re()}
   else if(b.dataset.motion){st.motion=b.dataset.motion;applyTheme();OC.Store.save();re()}
   else if(b.dataset.theme){st.theme=b.dataset.theme;applyTheme();OC.Store.save();re()}
   else if(b.dataset.cine){st.cine=b.dataset.cine;OC.Store.save();re()}
   else if(b.hasAttribute('data-exp')){U.buzz(8);this.download(await OC.Store.exportAll(),`oc-shimeji-backup-${U.dayKey()}.json`)}
   else if(b.hasAttribute('data-imp')){const t=await this.pickFile('.json,application/json');if(t)try{if(await UI.confirm({title:'還原這份備份？',msg:'目前的進度會先存成快照，之後可以在「每日自動快照」找回。',ok:'還原'}))await OC.Store.importAll(t)}catch(err){UI.toast(err.message,'warn')}}
   else if(b.hasAttribute('data-snaps')){this.snapSheet()}
   else if(b.hasAttribute('data-gc')){const n=await OC.Store.gc();UI.toast(n?`清理了 ${n} 個沒有使用的素材`:'沒有需要清理的素材','check')}
   else if(b.hasAttribute('data-legacy')){const n=await OC.Store.importLegacy();Sim.sync();UI.toast(`匯入了 ${n} 位夥伴（已存在的不重複）`,'check')}
   else if(b.hasAttribute('data-intro')){s.close();OC.Intro.replay()}
   else if(b.hasAttribute('data-tut')){s.close();OC.Tutorial.start()}
   else if(b.hasAttribute('data-petset')){s.close();OC.PetUI.open()}
   else if(b.hasAttribute('data-reset')){if(await UI.confirm({title:'重新開始？',msg:'目前的島嶼、夥伴與進度都會清除（每日快照仍會保留）。建議先匯出備份。',ok:'清除並重新開始',danger:true})){await OC.Store.snapshot('before-reset');OC.Store.reset()}}});
  s.el.addEventListener('change',e=>{const k=e.target.dataset.s;if(!k)return;st[k]=e.target.checked;OC.Store.save()})},
 /* 每日快照清單 */
 async snapSheet(){const L=await OC.Store.snapshots();const T={auto:'每日自動','before-import':'匯入前','before-restore':'還原前','before-reset':'重新開始前'};
  const s=UI.sheet(L.length?L.map(x=>`<div class="qrow"><span class="q-i">${ic('book',26)}</span><div><b>${new Date(x.at).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</b><small>${T[x.tag]||x.tag}・${x.chars} 位夥伴</small></div><button class="btn sm" data-snap="${esc(x.k)}">還原</button></div>`).join('')+'<p class="hint">每天自動保留一份，最多 7 份。還原前會先把目前進度存成快照。</p>':'<p class="empty">還沒有快照（遊戲開啟後會自動建立）</p>',{title:'每日快照',icon:'book'});
  s.el.addEventListener('click',async e=>{const b=e.target.closest('[data-snap]');if(!b)return;if(await UI.confirm({title:'還原這份快照？',msg:'遊戲會重新載入。',ok:'還原'}))try{await OC.Store.restoreSnapshot(b.dataset.snap)}catch(err){UI.toast(err.message,'warn')}})},
 download(text,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);if(OC.Native.has())OC.Native.saveFile(name,text);UI.toast('已匯出','check')},
 pickFile(accept,asData){return new Promise(res=>{const i=$('#fileIn');i.accept=accept;i.value='';i.onchange=()=>{const f=i.files[0];if(!f){res(null);return}const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);asData?r.readAsDataURL(f):r.readAsText(f)};i.click()})},
 /* ================= 事件綁定 ================= */
 bind(pg){pg.onclick=async e=>{const t=e.target.closest('button,[data-cid]');if(!t)return;U.buzz(5);
  if(t.hasAttribute('data-close')){this.close();return}
  if(this.cur==='bag'&&OC.Bag.click(t))return;if(this.cur==='shop'&&OC.ShopUI.click(t))return;if(this.cur==='life'&&this.tab==='home'&&OC.Deco.click(t))return;
  if(t.dataset.hub){this.hub(t.dataset.hub);return}
  if(t.dataset.isl){e.stopPropagation();const c=OC.S.chars.find(x=>x.id===t.dataset.isl);c.onIsland=c.onIsland===false;if(c.onIsland){c.loc='home';c.x=null;Sim.sync();UI.toast(`${c.name}回到小島了`,'heart')}else{if([...Sim.agents.keys()].length<=1){c.onIsland=true;UI.toast('島上至少要有一位夥伴','warn');return}Sim.sync()}OC.Store.save();this.render();return}
  if(t.dataset.pet){e.stopPropagation();const id=t.dataset.pet;const P=OC.S.petIds;if(P.includes(id))OC.S.petIds=P.filter(x=>x!==id);else{if(P.length>=(OC.S.settings.petMax||2))P.shift();P.push(id)}OC.Store.flush();OC.Native.syncPets(true);this.render();if(!OC.Native.has())UI.toast('已設為桌寵。安裝 Android 版即可在手機桌面上顯示','info');return}
  if(t.dataset.cid){this.profile(t.dataset.cid);return}
  if(t.hasAttribute('data-new')){OC.Editor.create();return}
  if(t.dataset.rel){const [a,b]=t.dataset.rel.split('|');this.relSheet(a,b);return}
  if(t.dataset.go){const id=t.dataset.go;if(t.classList.contains('lock')){UI.toast(id==='house'?'先在家園放一棟房子':'尚未解鎖','info');return}this.close();if(id!==OC.R.sc.id)OC.World.go(id);return}
  if(t.dataset.ltab){this.tab=t.dataset.ltab;this.render();return}
  if(t.dataset.claim!=null){const q=OC.S.quests.list[+t.dataset.claim];if(OC.Quests.claim(q)){UI.celebrate(null,`+${q.r} 星幣`,'任務完成','coin');this.render()}return}}}};
function $$(s,r=document){return[...r.querySelectorAll(s)]}
function applyTheme(){const st=OC.S.settings,r=document.documentElement;const d=st.theme==='dark'||(st.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'dark':'light';r.dataset.motion=OC.Store.perf().reduce?'reduce':'full';const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#1F2630':'#F6F0E4'}
Pages.applyTheme=applyTheme;
OC.Pages=Pages;
})(window.OC);

<script data-src="ui/editor.js">
/* OC Shimeji v4 · 角色編輯器（創角／捏角／性格／飲食／資料），即時動畫預覽 */
(function(OC){'use strict';
const {U,Content:C,Chars,UI}=OC;const {$,esc}=U;const ic=UI.ic;
const OPT_T={head:'臉型',ears:'耳朵',eye:'眼睛',brow:'眉毛',cheekStyle:'臉頰',mouth:'嘴巴',pattern:'花紋',tail:'尾巴',tailSide:'尾巴位置',acc:'服裝',smallAcc:'小配件'};
const RNG_T={headSize:'頭部大小',earSize:'耳朵大小',eyeSize:'眼睛大小',eyeSpace:'眼距',eyeY:'眼睛高度',mouthY:'嘴巴高度',cheeks:'腮紅濃度',accX:'配件左右',accY:'配件上下',accScale:'配件大小',accRot:'配件角度'};
const Editor={
 create(after){const c=OC.Chars.make({name:'',look:OC.CAT_RAND(),traits:[]});c._new=true;c.name=U.pick(['小栗','雪糕','麻吉','七七','團團','芝麻','布丁','小滿','可可','阿墨']);this.open(null,c,after)},
 open(id,draft,after){const src=draft||OC.S.chars.find(c=>c.id===id);if(!src)return;const c=JSON.parse(JSON.stringify(src));this.c=c;this.isNew=!!draft;this.after=after;this.tab='look';
  const s=UI.sheet(`<div class="ed"><div class="ed-pv"><canvas id="edCv"></canvas><div class="ed-test">${[['walk','走走'],['hop','跳跳'],['happy','開心'],['eat','吃東西'],['sleep','睡覺'],['angry','生氣']].map(([k,t])=>`<button data-test="${k}">${t}</button>`).join('')}</div></div>
   <div class="tabs" id="edTabs">${[['look','外觀'],['pers','性格'],['food','飲食'],['info','資料']].map(([k,t])=>`<button data-et="${k}" class="${k==='look'?'on':''}">${t}</button>`).join('')}</div><div id="edBody" class="ed-b"></div>
   <div class="ed-foot"><button class="btn ghost" data-cancel>取消</button><button class="btn primary" data-save>${this.isNew?'完成，讓夥伴登場！':'儲存'}</button></div></div>`,{full:true,cls:'ed-s',onClose:()=>this.stop()});

  s.el.addEventListener('click',e=>this.click(e));s.el.addEventListener('input',e=>this.input(e));s.el.addEventListener('change',e=>this.input(e,true))},
 /* ---------- 即時預覽（迷你舞台） ---------- */
 pv(){const cv=$('#edCv',this.s.el);const g=cv.getContext('2d');const dpr=Math.min(2,devicePixelRatio||1);const a=new OC.Sim.Agent(Object.assign({},this.c,{loc:'home',x:0,z:0}));a.c=this.c;this.a=a;a.x=0;a.z=0;let last=performance.now(),walkX=0;
  const loop=t=>{if(!this.on)return;this.raf=requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;const r=cv.getBoundingClientRect();if(cv.width!==Math.round(r.width*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
   g.setTransform(dpr,0,0,dpr,0,0);const W=r.width,H=r.height;const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#CFE8F5');gr.addColorStop(.62,'#EAF4E4');gr.addColorStop(.63,'#A9D18E');gr.addColorStop(1,'#8DBF74');g.fillStyle=gr;g.fillRect(0,0,W,H);

   <p class="hint">點已擺放的東西可以拖曳移動或收回背包。家具店與創作市集有更多家具。</p>`},
 click(t){const d=t.dataset;if(t.hasAttribute('data-house')){OC.Pages.close();OC.Intro.houseOnly(true);return true}
  if(d.dplace){OC.Pages.close();this.placeItem(d.dplace);return true}
  if(d.fmove){OC.Pages.close();OC.World.go('house');setTimeout(()=>this.move('furn',d.fmove),500);return true}
  if(d.bmove){OC.Pages.close();OC.World.go('home');setTimeout(()=>this.move('build',d.bmove),500);return true}return false},
 placeItem(id){const it=OC.Shop.item(id);if(!it)return;if(!Items.take(id))return;const W=OC.S.world;
  if(it.cat==='furn'){if(!(W.house&&W.house.placed)){Items.add(id,1);OC.UI.toast('先在家園放一棟房子','info');return}const F=W.houseFurn||(W.houseFurn=[]);const k=it.furn||it.furnCr||id;
   let p={x:0,z:.4};for(let i=0;i<40;i++){const q={x:U.rnd(-3,3),z:U.rnd(-1.8,1.8)};if(!F.some(f=>Math.hypot(f.x-q.x,f.z-q.z)<1.4)){p=q;break}}
   const f={id:U.uid('f'),k,x:+p.x.toFixed(2),z:+p.z.toFixed(2)};F.push(f);OC.Scenes.syncFurn();OC.Store.flush();const go=()=>this.move('furn',f.id);if(OC.R.sc.id!=='house'){OC.World.go('house');setTimeout(go,500)}else go()}
  else if(it.cat==='build'){const B=W.builds||(W.builds=[]);const c=OC.R.cam;const b={id:U.uid('b'),cid:it.buildCr||id,x:+(OC.R.sc.id==='home'?c.tx:2).toFixed(2),z:+(OC.R.sc.id==='home'?c.tz:2).toFixed(2)};B.push(b);OC.Scenes.syncBuilds();OC.Store.flush();const go=()=>this.move('build',b.id);if(OC.R.sc.id!=='home'){OC.World.go('home');setTimeout(go,500)}else go()}},
 /* 拖曳擺放（家具在屋內、建築在小島） */
 move(kind,id){const W=OC.S.world;const L=kind==='furn'?W.houseFurn:W.builds;const F=(L||[]).find(f=>f.id===id);if(!F)return;const cam=OC.R.cam;const el=$('#intro');el.hidden=false;el.className='intro place';
  const it=kind==='furn'?furnIt(F.k):OC.Creations.item(F.cid);el.innerHTML=`<div class="pl-tip"><b>拖曳${esc(it?it.name:'')}到新位置</b><small>點完成即可儲存</small></div><div class="pl-bar"><button class="btn ghost" data-store>${ic('bag',18)}收回背包</button><button class="btn primary" data-ok>${ic('check',18)}完成</button></div>`;
  const sync=()=>{kind==='furn'?OC.Scenes.syncFurn():OC.Scenes.syncBuilds();OC.R.invalidate()};let drag=null;
  OC.UI.placing={down:p=>{drag={w0:cam.unproject(p.x,p.y),x:F.x,z:F.z}},move:p=>{if(!drag)return;const w=cam.unproject(p.x,p.y);const b=kind==='furn'?[-3.4,-2.3,3.4,2.2]:OC.R.sc.bounds;F.x=+U.clamp(drag.x+w.x-drag.w0.x,b[0],b[2]).toFixed(2);F.z=+U.clamp(drag.z+w.z-drag.w0.z,b[1],b[3]).toFixed(2);sync()},up:()=>{drag=null;U.buzz(5)},cancel:()=>{done()}};
  OC.Cam.follow=false;OC.UI.followChanged();
  const done=()=>{OC.UI.placing=null;OC.Store.flush();el.className='intro';el.hidden=true;el.innerHTML=''};
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-store')){const idx=L.indexOf(F);L.splice(idx,1);Items.add(kind==='furn'?(C.ITEMS.find(i=>i.furn===F.k)||{id:F.k}).id:F.cid,1);sync();OC.UI.toast('已收回背包','check')}done()}}};

/* ================= 拍照模式 ================= */
const FILTERS=[['none','自然',''],['warm','暖陽','sepia(.25) saturate(1.2) brightness(1.04)'],['film','底片','contrast(1.08) saturate(.85) sepia(.15)'],['cool','清晨','hue-rotate(-10deg) saturate(1.1) brightness(1.05)'],['mono','黑白','grayscale(1) contrast(1.1)']];
const Photo={on:false,f:'none',
 open(){if(this.on)return;this.on=true;document.body.classList.add('photo');OC.UI.closeFloating();const el=U.el(`<div class="photo-ui" id="photoUi"><div class="ph-frame"></div><div class="ph-top"><button class="rb" data-pc>${ic('close',20)}</button><b>拍照模式</b><button class="rb" data-pn>${ic('users',22)}</button></div>
   <div class="ph-bot"><div class="chips sc">${FILTERS.map(([k,t])=>`<button class="chip ${k===this.f?'on':''}" data-pf="${k}">${t}</button>`).join('')}</div><button class="shutter" data-shot aria-label="拍照"><i></i></button></div><div class="ph-flash"></div></div>`);
  document.getElementById('app').appendChild(el);this.el=el;this.applyF();this.names=OC.S.settings.names;
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-pc'))this.close();else if(b.dataset.pf){this.f=b.dataset.pf;el.querySelectorAll('[data-pf]').forEach(x=>U.toggle(x,'on',x===b));this.applyF()}else if(b.hasAttribute('data-pn')){OC.S.settings.names=!OC.S.settings.names;U.toggle(b,'on',!OC.S.settings.names)}else if(b.hasAttribute('data-shot'))this.shot()}},
 applyF(){$('#world').style.filter=(FILTERS.find(f=>f[0]===this.f)||[])[2]||''},
 shot(){U.buzz(30);const fl=$('.ph-flash',this.el);fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');
  const src=$('#world');const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const g=c.getContext('2d');g.filter=(FILTERS.find(f=>f[0]===this.f)||[])[2]||'none';g.drawImage(src,0,0);g.filter='none';
  const k=c.width/src.getBoundingClientRect().width;g.fillStyle='rgba(255,255,255,.9)';g.font=`700 ${13*k}px "Nunito","Noto Sans TC",sans-serif`;g.textAlign='right';g.fillText('OC Shimeji · '+OC.Env.label().date,c.width-14*k,c.height-16*k);
  const url=c.toDataURL('image/jpeg',.9);const s=OC.UI.dialog(`<img class="ph-prev" src="${url}" alt=""><div class="row end"><button class="btn ghost" data-x>不要了</button><button class="btn primary" data-save>${ic('export',18)}儲存照片</button></div>`);
  s.el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-save')){const name=`oc-shimeji-${Date.now()}.jpg`;if(OC.Native.has())OC.Native.call('saveImage',name,url);else{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}OC.UI.toast('照片已儲存','check');OC.Items.xp(3)}s.close()})},
 close(){if(!this.on)return;this.on=false;OC.S.settings.names=this.names;document.body.classList.remove('photo');$('#world').style.filter='';this.el.remove()}};

/* ================= 桌寵設定 ================= */
const PetUI={
 cfg(){return OC.S.settings.pet=Object.assign({size:100,battery:false,climb:true,roam:true,appAware:false,talk:'normal',max:2},OC.S.settings.pet||{})},

   <h3 class="sec">要出現在桌面的夥伴（最多 ${P.max} 位）</h3><div class="am-g">${OC.S.chars.map(c=>`<button class="${OC.S.petIds.includes(c.id)?'on':''}" data-pp="${c.id}"><span class="hav">${OC.Rig.avatarHTML(c)}</span><span>${esc(c.name)}</span></button>`).join('')}</div>
   <div class="opt"><span>大小 ${P.size}%</span><input type="range" min="60" max="160" step="5" value="${P.size}" data-ps></div>
