<!doctype html>
<html lang="zh-Hant" data-theme="light" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F6F0E4">
<meta name="color-scheme" content="light dark">
<title>OC Shimeji｜我的夥伴小島</title>
<script>
/* 提早套用主題，避免啟動閃一下 */
(function(){try{var s=JSON.parse(localStorage.getItem('ocs4.save')||'{}').settings||{};var t=s.theme||'system';var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);var r=document.documentElement;r.dataset.theme=d?'dark':'light';var m=s.motion||'system';r.dataset.motion=(m==='reduce'||(m==='system'&&matchMedia('(prefers-reduced-motion: reduce)').matches))?'reduce':'full'}catch(e){}})();
</script>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="app">
  <canvas id="world" aria-label="小島"></canvas>
  <div id="hud"></div>
  <div id="qbag"></div>
  <main id="page" class="page"></main>
  <nav id="nav" aria-label="主要導覽"></nav>
  <div id="layer"></div>
  <div id="coach" class="coach"></div>
  <div id="intro" class="intro" hidden></div>
  <div id="celebrate"></div>
  <div id="toasts"></div>
  <div id="fade"></div>
  <div id="dghost"></div>
  <div id="splash"><b>OC SHIMEJI</b></div>
</div>
<input type="file" id="fileIn">
<script src="src/core/util.js"></script>
<script src="src/art/icons.js"></script>
<script src="src/art/cat-svg.js"></script>
<script src="src/sim/legacy-data.js"></script>
<script src="src/sim/content.js"></script>
<script src="src/core/store.js"></script>
<script src="src/sim/chars.js"></script>
<script src="src/world/env.js"></script>
<script src="src/art/sprites.js"></script>
<script src="src/world/scenes.js"></script>
<script src="src/world/renderer.js"></script>
<script src="src/art/rig.js"></script>
<script src="src/sim/actions.js"></script>
<script src="src/sim/sim.js"></script>
<script src="src/sim/social.js"></script>
<script src="src/sim/group.js"></script>
<script src="src/game/quests.js"></script>
<script src="src/game/play.js"></script>
<script src="src/game/cine.js"></script>
<script src="src/game/creations.js"></script>
<script src="src/core/native.js"></script>
<script src="src/ui/ui.js"></script>
<script src="src/ui/bag.js"></script>
<script src="src/ui/shop.js"></script>
<script src="src/ui/pages.js"></script>
<script src="src/ui/editor.js"></script>
<script src="src/ui/studio.js"></script>
<script src="src/ui/workshop.js"></script>
<script src="src/ui/deco.js"></script>
<script src="src/ui/intro.js"></script>
<script src="src/core/main.js"></script>
<script>
window.addEventListener('error',e=>{console.error('[oc]',e.message)});
OC.boot().catch(e=>{console.error(e);var s=document.getElementById('splash');if(s)s.innerHTML='<b style="font-size:15px;letter-spacing:0">啟動失敗：'+String(e&&e.message||e)+'</b>'});
</script>
</body>
</html>
